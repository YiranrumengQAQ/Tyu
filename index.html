<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffd60a" />
<meta name="description" content="BASE64 STUDIO — 由 JLC 0.2 字节码内核驱动的纯前端 Base64 工作台" />
<title>BASE64 STUDIO · JLC 0.2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ffd60a'/%3E%3Cpath d='M9 23 16 9l7 14' fill='none' stroke='%23101014' stroke-width='3'/%3E%3C/svg%3E" />

<style>
  /* ============================================================
     设计令牌（--accent 由 JLC style 声明运行时注入）
     ============================================================ */
  :root {
    color-scheme: light;
    --bg:        #f3eee3;
    --surface:   #fffdf7;
    --field:     #fffdf7;
    --ink:       #101014;
    --muted:     #6c6c7c;
    --border:    #101014;
    --shadow:    #101014;
    --hover:     #fff0b8;
    --accent:    #ffd60a;
    --on-accent: #101014;
    --pink:      #ff5c8a;
    --blue:      #4d7cff;
    --green:     #22c96b;
    --grid:      rgba(16, 16, 20, .07);

    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
            "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
            "Noto Sans Mono", "Courier New", monospace;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg:      #0d0d12;
    --surface: #1a1a22;
    --field:   #131319;
    --ink:     #f4f1ea;
    --muted:   #9c9cb0;
    --border:  #f4f1ea;
    --shadow:  #5a5a75;
    --hover:   #23232f;
    --pink:    #ff85a7;
    --blue:    #7aa5ff;
    --green:   #4fe29c;
    --grid:    rgba(244, 241, 234, .05);
  }

  /* ============================================================
     基础
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

  body {
    margin: 0;
    min-height: 100dvh;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.55;
    transition: background-color .3s ease, color .3s ease;
    overflow-x: hidden;
  }

  button, textarea, input { font-family: inherit; }

  ::selection { background: var(--accent); color: var(--on-accent); }

  /* ============================================================
     SVG 图标系统
     ============================================================ */
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  .icon {
    width: 20px;
    height: 20px;
    flex: 0 0 auto;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .icon--lg { width: 26px; height: 26px; }

  /* ============================================================
     启动动画
     ============================================================ */
  .boot {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: grid;
    place-items: center;
    padding: 24px;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    transition: opacity .5s ease, visibility .5s ease;
  }
  .boot--done { opacity: 0; visibility: hidden; }

  .boot-card {
    padding: 36px 42px 32px;
    background: var(--surface);
    border: 3px solid var(--border);
    box-shadow: 9px 9px 0 var(--shadow);
    text-align: center;
    animation: bootIn .45s cubic-bezier(.2, .85, .25, 1) both;
  }
  @keyframes bootIn {
    from { opacity: 0; transform: translateY(18px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }

  .boot-mark {
    display: grid;
    place-items: center;
    width: 58px;
    height: 58px;
    margin: 0 auto 22px;
    background: var(--accent);
    color: var(--on-accent);
    border: 3px solid var(--border);
    box-shadow: 4px 4px 0 var(--shadow);
    animation: bootMark 1.4s ease-in-out infinite;
  }
  @keyframes bootMark {
    0%, 100% { transform: rotate(-6deg) scale(1); }
    50%      { transform: rotate(6deg)  scale(1.06); }
  }

  .boot-title {
    margin: 0 0 4px;
    font-size: 1.05rem;
    font-weight: 900;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .boot-sub {
    margin: 0 0 22px;
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .1em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .boot-track {
    width: min(240px, 60vw);
    height: 14px;
    margin: 0 auto 14px;
    background: var(--field);
    border: 3px solid var(--border);
    box-shadow: 3px 3px 0 var(--shadow);
    overflow: hidden;
  }
  .boot-track i {
    display: block;
    height: 100%;
    width: 0;
    background: repeating-linear-gradient(
      45deg,
      var(--accent) 0 9px,
      var(--pink)   9px 18px,
      var(--blue)   18px 27px,
      var(--green)  27px 36px
    );
    animation: bootFill 1.3s cubic-bezier(.55, 0, .25, 1) forwards;
  }
  @keyframes bootFill { to { width: 100%; } }

  .boot-steps {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px 14px;
    margin: 0 0 10px;
    font-family: var(--mono);
    font-size: .6rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .boot-steps span { opacity: .55; animation: stepOn 2s ease forwards; }
  .boot-steps span:nth-child(1) { animation-delay: .05s; }
  .boot-steps span:nth-child(2) { animation-delay: .22s; }
  .boot-steps span:nth-child(3) { animation-delay: .39s; }
  .boot-steps span:nth-child(4) { animation-delay: .56s; }
  .boot-steps span:nth-child(5) { animation-delay: .73s; }
  .boot-steps span:nth-child(6) { animation-delay: .90s; }
  .boot-steps span:nth-child(7) { animation-delay: 1.07s; }
  @keyframes stepOn { to { opacity: 1; } }

  .boot-hint {
    margin: 0;
    font-family: var(--mono);
    font-size: .7rem;
    color: var(--muted);
  }

  /* ============================================================
     应用外壳
     ============================================================ */
  .shell {
    max-width: 1180px;
    margin: 0 auto;
    padding: 22px 16px 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    animation: shellIn .55s cubic-bezier(.2, .85, .25, 1) both;
  }
  @keyframes shellIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    padding: 14px 18px;
    background: var(--surface);
    border: 3px solid var(--border);
    box-shadow: 7px 7px 0 var(--shadow);
  }

  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }

  .logo {
    display: grid;
    place-items: center;
    width: 50px;
    height: 50px;
    flex: 0 0 auto;
    background: var(--accent);
    color: var(--on-accent);
    border: 3px solid var(--border);
    box-shadow: 4px 4px 0 var(--shadow);
    transform: rotate(-4deg);
    transition: transform .25s cubic-bezier(.2, .85, .25, 1);
  }
  .topbar:hover .logo { transform: rotate(4deg) scale(1.05); }

  .brand-text { min-width: 0; }
  .brand-title {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .brand-sub {
    margin: 1px 0 0;
    font-family: var(--mono);
    font-size: .66rem;
    letter-spacing: .05em;
    color: var(--muted);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .topbar-right { display: flex; align-items: center; gap: 12px; }

  .badge {
    padding: 6px 12px;
    font-family: var(--mono);
    font-size: .7rem;
    font-weight: 900;
    letter-spacing: .06em;
    color: var(--on-accent);
    border: 3px solid var(--border);
    box-shadow: 3px 3px 0 var(--shadow);
    white-space: nowrap;
  }

  /* ---------- 按钮 ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    font-family: inherit;
    font-size: .78rem;
    font-weight: 900;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--surface);
    border: 3px solid var(--border);
    box-shadow: 4px 4px 0 var(--shadow);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: transform .12s ease, box-shadow .12s ease, background-color .15s ease;
  }
  .btn:hover:not(:disabled)  { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--shadow); }
  .btn:active:not(:disabled) { transform: translate(2px, 2px);   box-shadow: 1px 1px 0 var(--shadow); }
  .btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .btn:disabled {
    opacity: .4;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: 4px 4px 0 var(--shadow) !important;
  }
  .btn--primary { background: var(--accent); color: var(--on-accent); }
  .btn--ghost   { background: transparent; }
  .btn--icon    { padding: 10px; }
  .btn--sm      { padding: 7px 11px; font-size: .7rem; box-shadow: 3px 3px 0 var(--shadow); }
  .btn--sm.btn--icon { padding: 7px; }
  .btn--sm .icon { width: 16px; height: 16px; }

  /* ---------- 复选框 ---------- */
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    font-size: .7rem;
    font-weight: 900;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--surface);
    border: 3px solid var(--border);
    box-shadow: 3px 3px 0 var(--shadow);
    cursor: pointer;
    user-select: none;
  }
  .toggle input {
    appearance: none;
    -webkit-appearance: none;
    width: 17px;
    height: 17px;
    margin: 0;
    border: 3px solid var(--border);
    background: var(--field);
    cursor: pointer;
    position: relative;
    transition: background-color .15s ease;
  }
  .toggle input:checked { background: var(--accent); }
  .toggle input:checked::after {
    content: "";
    position: absolute;
    inset: 2px;
    background: var(--on-accent);
  }
  .toggle input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  /* ---------- 控制条 ---------- */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 18px 30px;
    align-items: center;
    padding: 16px 18px;
    background: var(--surface);
    border: 3px solid var(--border);
    box-shadow: 7px 7px 0 var(--shadow);
  }
  .control-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .control-label {
    font-size: .66rem;
    font-weight: 900;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .segmented {
    display: inline-flex;
    background: var(--surface);
    border: 3px solid var(--border);
    box-shadow: 4px 4px 0 var(--shadow);
  }
  .seg {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 15px;
    font-family: inherit;
    font-size: .76rem;
    font-weight: 900;
    letter-spacing: .06em;
    color: var(--ink);
    background: transparent;
    border: none;
    border-right: 3px solid var(--border);
    cursor: pointer;
    transition: background-color .15s ease, color .15s ease;
  }
  .seg:last-child { border-right: none; }
  .seg:hover { background: var(--hover); }
  .seg--active { background: var(--accent); color: var(--on-accent); }
  .seg--active:hover { background: var(--accent); }
  .seg:focus-visible { outline: 3px solid var(--blue); outline-offset: -3px; }

  /* ---------- 工作区 ---------- */
  .workspace {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  @media (min-width: 880px) {
    .workspace { grid-template-columns: 1fr 1fr; }
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  @media (min-width: 880px) {
    .grid-2 { grid-template-columns: 1fr 1fr; }
  }

  .panel {
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--surface);
    border: 3px solid var(--border);
    box-shadow: 7px 7px 0 var(--shadow);
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 3px solid var(--border);
  }
  .panel-title {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: .76rem;
    font-weight: 900;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .panel-actions { display: flex; align-items: center; gap: 10px; }

  .counter {
    font-family: var(--mono);
    font-size: .68rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .editor {
    flex: 1 1 auto;
    width: 100%;
    min-height: 220px;
    padding: 16px;
    color: var(--ink);
    background: var(--field);
    border: none;
    outline: none;
    resize: vertical;
    font-family: var(--mono);
    font-size: .86rem;
    line-height: 1.65;
    transition: background-color .2s ease;
  }
  .editor:focus { background: var(--hover); }
  .editor::placeholder { color: var(--muted); opacity: .8; }

  .output {
    flex: 1 1 auto;
    min-height: 220px;
    max-height: 420px;
    padding: 16px;
    overflow: auto;
    background: var(--field);
  }
  .output--compact { min-height: 150px; max-height: 240px; }
  .output-text {
    margin: 0;
    font-family: var(--mono);
    font-size: .86rem;
    line-height: 1.65;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .output--nowrap .output-text {
    white-space: pre;
    overflow-wrap: normal;
    word-break: normal;
  }

  .output-empty,
  .output-error {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 180px;
    justify-content: center;
    font-size: .82rem;
    color: var(--muted);
    text-align: center;
  }
  .output--compact .output-empty,
  .output--compact .output-error { min-height: 120px; }
  .output-error {
    align-items: flex-start;
    justify-content: flex-start;
    padding: 14px;
    color: var(--ink);
    background: color-mix(in srgb, var(--pink) 22%, transparent);
    border: 3px solid var(--border);
    box-shadow: 4px 4px 0 var(--shadow);
    font-family: var(--mono);
    font-size: .78rem;
  }
  .output-error .icon { color: var(--pink); }

  .panel-foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-top: 3px solid var(--border);
  }

  /* ---------- 键值列表 ---------- */
  .kv { display: flex; flex-direction: column; gap: 9px; }
  .kv-row { display: flex; gap: 10px; align-items: baseline; }
  .kv-key {
    flex: 0 0 74px;
    font-family: var(--mono);
    font-size: .6rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .kv-val {
    flex: 1 1 auto;
    min-width: 0;
    font-family: var(--mono);
    font-size: .74rem;
    overflow-wrap: anywhere;
  }

  /* ---------- 指标网格 ---------- */
  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
    gap: 10px;
    padding: 16px;
  }
  .metric {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 9px 11px;
    background: var(--field);
    border: 2px solid var(--border);
    box-shadow: 3px 3px 0 var(--shadow);
  }
  .metric-label {
    font-family: var(--mono);
    font-size: .56rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .metric-value {
    font-family: var(--mono);
    font-size: 1.05rem;
    font-weight: 900;
    line-height: 1.2;
    color: var(--ink);
  }

  /* ---------- 历史 ---------- */
  .history {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 16px;
    border-top: 3px solid var(--border);
    transition: background-color .15s ease;
    animation: rowIn .3s cubic-bezier(.2, .85, .25, 1) both;
  }
  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: none; }
  }
  .history-item:first-child { border-top: none; }
  .history-item:hover { background: var(--hover); }

  .history-main { flex: 1 1 auto; min-width: 0; }
  .history-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }

  .chip {
    padding: 2px 9px;
    font-size: .6rem;
    font-weight: 900;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--on-accent);
    background: var(--accent);
    border: 2px solid var(--border);
  }
  .chip--muted { background: var(--blue); color: #fff; }
  .history-size {
    font-family: var(--mono);
    font-size: .66rem;
    color: var(--muted);
  }
  .history-preview {
    display: block;
    font-family: var(--mono);
    font-size: .76rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-actions { display: flex; gap: 8px; flex: 0 0 auto; }

  .history-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 34px 16px;
    color: var(--muted);
    font-size: .8rem;
    text-align: center;
  }

  /* ---------- 页脚 ---------- */
  .footer {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding-top: 4px;
    font-family: var(--mono);
    font-size: .66rem;
    letter-spacing: .05em;
    color: var(--muted);
    text-align: center;
  }
  .footer .dot { color: var(--accent); }
  .clock {
    padding: 1px 8px;
    color: var(--ink);
    background: var(--field);
    border: 2px solid var(--border);
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    z-index: 60;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    max-width: calc(100vw - 32px);
    padding: 12px 20px;
    font-size: .8rem;
    font-weight: 800;
    letter-spacing: .03em;
    color: var(--ink);
    background: var(--surface);
    border: 3px solid var(--border);
    box-shadow: 5px 5px 0 var(--shadow);
    transform: translateX(-50%);
    animation: toastIn .28s cubic-bezier(.2, .85, .25, 1) both;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, 18px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  .toast--ok    { border-left-width: 12px; border-left-color: var(--green); }
  .toast--error { border-left-width: 12px; border-left-color: var(--pink); }
  .toast--info  { border-left-width: 12px; border-left-color: var(--blue); }
  .toast--ok    .icon { color: var(--green); }
  .toast--error .icon { color: var(--pink); }
  .toast--info  .icon { color: var(--blue); }

  /* ---------- 致命错误 ---------- */
  .fatal {
    margin: 24px auto;
    max-width: 860px;
    padding: 20px;
    font-family: var(--mono);
    font-size: .8rem;
    white-space: pre-wrap;
    background: var(--surface);
    border: 3px solid var(--border);
    box-shadow: 6px 6px 0 var(--shadow);
  }

  /* ============================================================
     JBC 字节码检查器
     ============================================================ */
  .jbc-panel {
    margin: 0 auto 44px;
    max-width: 1180px;
    border: 3px solid var(--border);
    background: var(--surface);
    box-shadow: 9px 9px 0 var(--shadow);
    font-family: var(--mono);
  }

  .jbc-panel > summary {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    cursor: pointer;
    font-size: .7rem;
    letter-spacing: .04em;
    color: var(--muted);
    user-select: none;
    list-style: none;
  }
  .jbc-panel > summary::-webkit-details-marker { display: none; }
  .jbc-panel > summary::after {
    content: "▸";
    margin-left: auto;
    font-size: .9rem;
    color: var(--muted);
    transition: transform .2s ease;
  }
  .jbc-panel[open] > summary::after { transform: rotate(90deg); }
  .jbc-panel > summary:hover { color: var(--ink); }

  .jbc-badge {
    display: inline-block;
    padding: 2px 8px;
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--on-accent);
    background: var(--accent);
    border: 2px solid var(--border);
  }

  .jbc-body {
    padding: 16px 18px 20px;
    border-top: 3px solid var(--border);
  }

  .jbc-stats {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .jbc-stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px 12px;
    background: var(--field);
    border: 2px solid var(--border);
  }
  .jbc-stat-label {
    font-size: .58rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .jbc-stat-value {
    font-size: .84rem;
    font-weight: 700;
    color: var(--ink);
  }
  .jbc-stat-value--accent { color: var(--accent); }
  .jbc-stat-value--pink   { color: var(--pink); }
  .jbc-stat-value--blue   { color: var(--blue); }
  .jbc-stat-value--green  { color: var(--green); }

  .jbc-section-title {
    margin: 0 0 8px;
    font-size: .6rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .jbc-histogram {
    display: flex;
    flex-wrap: wrap;
    gap: 7px 16px;
    margin-bottom: 16px;
    font-size: .66rem;
  }
  .jbc-bar { display: inline-flex; align-items: center; gap: 6px; }
  .jbc-bar-name { color: var(--muted); }
  .jbc-bar-track {
    display: inline-block;
    width: 56px;
    height: 8px;
    position: relative;
    background: var(--field);
    border: 2px solid var(--border);
  }
  .jbc-bar-fill { display: block; height: 100%; background: var(--accent); }

  .jbc-disassembly {
    max-height: 400px;
    overflow: auto;
    margin: 0;
    padding: 14px;
    font-size: .62rem;
    line-height: 1.55;
    white-space: pre;
    tab-size: 2;
    color: var(--ink);
    background: var(--bg);
    border: 2px solid var(--border);
  }

  /* ============================================================
     响应式
     ============================================================ */
  @media (max-width: 640px) {
    .shell { padding: 14px 12px 26px; gap: 16px; }
    .topbar { padding: 12px 14px; box-shadow: 5px 5px 0 var(--shadow); }
    .controls { padding: 14px; gap: 14px; box-shadow: 5px 5px 0 var(--shadow); }
    .panel { box-shadow: 5px 5px 0 var(--shadow); }
    .brand-title { font-size: 1rem; letter-spacing: .06em; }
    .logo { width: 42px; height: 42px; }
    .logo .icon { width: 22px; height: 22px; }
    .editor, .output { min-height: 180px; }
    .seg { padding: 9px 12px; font-size: .72rem; }
    .btn { padding: 9px 13px; font-size: .72rem; }
    .history-item { padding: 11px 13px; }
    .toast { bottom: 16px; padding: 11px 16px; }
    .jbc-panel { margin: 0 12px 32px; box-shadow: 5px 5px 0 var(--shadow); }
    .jbc-stats { grid-template-columns: 1fr 1fr; }
    .metrics { grid-template-columns: repeat(3, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>

<script>
  /* 首帧前决定主题，避免闪白 */
  (function () {
    try {
      var saved = localStorage.getItem("jlc-b64-theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  })();
</script>
</head>

<!-- ============================================================
     JLC 源码 —— 全部界面与交互逻辑，由本语言书写
     ============================================================ -->
<script type="text/jlc" id="jlc-source">
app Base64Studio {
  state theme = "light";
  state mode = $route.query.mode == "decode" ? "decode" : "encode";
  state variant = "standard";
  state accentIndex = 0;
  state input = "";
  state history = [];
  state toast = "";
  state toastKind = "info";
  state seq = 0;
  state clock = "";
  state stats = kernelStats();
  state sampleIndex = 0;
  state outputWrap = true;

  derive accents = ["#ffd60a", "#ff5c8a", "#4d7cff", "#22c96b", "#c084fc"];
  derive accent = get(accents, accentIndex, "#ffd60a");

  derive output = mode == "encode"
    ? b64encode(input, variant == "url")
    : b64decode(input, variant == "url");

  derive outputText = output.ok ? output.value : "";
  derive outputError = output.ok ? "" : output.error;
  derive inputChars = len(input);
  derive outputChars = len(outputText);
  derive modeLabel = mode == "encode" ? "编码" : "解码";
  derive variantLabel = variant == "url" ? "URL 安全" : "标准";
  derive historyCount = len(history);
  derive toastIcon = toastKind == "error" ? "#i-alert" : "#i-check";
  derive outputClass = "output" + (outputWrap ? "" : " output--nowrap");
  derive routePath = $route.path + ($route.query.mode ? "?mode=" + $route.query.mode : "");
  derive kernelVersion = "0.2.0";
  derive demoStatus = demo.loading ? "loading" : (demo.error != null ? "error" : "ready");

  resource demo = http(demoEndpoint(), { as: "json" });

  style ":root{--accent:" + accent + "}";

  action notify(message, kind = "info") {
    toast = message;
    toastKind = kind;
    after (2000) {
      if (toast == message) {
        toast = "";
      }
    }
  }

  action setMode(next) {
    if (mode != next) {
      mode = next;
      replace("?mode=" + next);
      notify("已切换到" + (next == "encode" ? "编码" : "解码") + "模式", "info");
    }
  }

  action setVariant(next) {
    if (variant != next) {
      variant = next;
      notify("字符集已切换为" + (next == "url" ? "URL 安全" : "标准"), "info");
    }
  }

  action toggleTheme() {
    theme = theme == "dark" ? "light" : "dark";
    applyTheme(theme);
    notify(theme == "dark" ? "暗色主题" : "亮色主题", "info");
  }

  action cycleAccent() {
    accentIndex = (accentIndex + 1) % len(accents);
    notify("强调色 " + string(accentIndex + 1) + " / " + string(len(accents)), "ok");
  }

  action loadSample() {
    let samples = [
      "JLC 内核 · Base64 工作台 —— 纯前端，零依赖，无 eval。",
      "The quick brown fox jumps over the lazy dog.",
      "{\"name\":\"JLC\",\"version\":\"0.2.0\",\"vm\":\"bytecode\"}",
      "Unicode 安全：中文 · emoji 🚀 · 数学 ∑∫√ · 日文 こんにちは"
    ];
    input = get(samples, sampleIndex, "");
    notify("示例 " + string(sampleIndex + 1) + " / " + string(len(samples)), "info");
    sampleIndex = (sampleIndex + 1) % len(samples);
  }

  action clearInput() {
    if (inputChars == 0) {
      notify("输入已经是空的", "info");
    } else {
      input = "";
      notify("已清空输入", "info");
    }
  }

  action swap() {
    if (output.ok && outputChars > 0) {
      input = outputText;
      mode = mode == "encode" ? "decode" : "encode";
      replace("?mode=" + mode);
      notify("已交换输入与输出", "ok");
    } else {
      notify("输出为空，无法交换", "error");
    }
  }

  action copyOutput() {
    if (output.ok && outputChars > 0) {
      if (copyText(outputText)) {
        notify("已复制 " + string(outputChars) + " 字符", "ok");
        title("已复制 · BASE64 STUDIO");
        after (1800) {
          title("BASE64 STUDIO · JLC 0.2");
        }
      } else {
        notify("复制失败，请手动选择", "error");
      }
    } else {
      notify("没有可复制的内容", "error");
    }
  }

  action saveEntry() {
    if (output.ok && outputChars > 0) {
      seq += 1;
      let preview = input;
      if (len(preview) > 48) {
        preview = slice(preview, 0, 48) + "…";
      }
      history = prepend(history, {
        id: seq,
        label: modeLabel,
        variant: variantLabel,
        preview: preview,
        payload: outputText,
        size: outputChars,
        time: clock
      });
      if (len(history) > 6) {
        history = slice(history, 0, 6);
      }
      notify("已保存到历史", "ok");
      emit("jlc:save", { size: outputChars, mode: mode, variant: variant });
    } else {
      notify("没有可保存的结果", "error");
    }
  }

  action useEntry(id) {
    for (entry in history) {
      if (entry.id == id) {
        input = entry.payload;
        notify("已载入历史记录", "ok");
      }
    }
  }

  action dropEntry(id) {
    let next = [];
    for (entry in history) {
      if (entry.id != id) {
        next = append(next, entry);
      }
    }
    history = next;
    notify("已删除该记录", "info");
  }

  action clearHistory() {
    if (historyCount == 0) {
      notify("历史已经是空的", "info");
      return;
    }
    history = [];
    notify("历史已清空", "info");
  }

  action retryDemo() {
    reload(demo);
    notify("正在重新请求自检数据…", "info");
  }

  action startTicker() {
    clock = currentTime();
    stats = kernelStats();
    every (1000) {
      clock = currentTime();
      stats = kernelStats();
    }
  }

  view {
    div(class = "shell") {

      header(class = "topbar") {
        div(class = "brand") {
          div(class = "logo") {
            svg(class = "icon icon--lg") { use(href = "#i-zap"); }
          }
          div(class = "brand-text") {
            h1(class = "brand-title") { text "BASE64 STUDIO"; }
            p(class = "brand-sub") {
              text "jlc vm v" + kernelVersion + " · " + modeLabel + " · " + variantLabel;
            }
          }
        }
        div(class = "topbar-right") {
          span(class = "badge", style:background = accent) {
            text string(outputChars) + " B";
          }
          button(
            class = "btn btn--icon",
            title = "切换亮色 / 暗色主题",
            aria:label = "切换主题",
            on:click = { toggleTheme(); }
          ) {
            when (theme == "dark") {
              svg(class = "icon") { use(href = "#i-sun"); }
            } else {
              svg(class = "icon") { use(href = "#i-moon"); }
            }
          }
        }
      }

      section(class = "controls") {
        div(class = "control-group") {
          span(class = "control-label") { text "模式"; }
          div(class = "segmented") {
            button(
              class = "seg" + (mode == "encode" ? " seg--active" : ""),
              on:click = { setMode("encode"); }
            ) {
              svg(class = "icon") { use(href = "#i-arrow-right"); }
              span { text "编码"; }
            }
            button(
              class = "seg" + (mode == "decode" ? " seg--active" : ""),
              on:click = { setMode("decode"); }
            ) {
              svg(class = "icon") { use(href = "#i-arrow-left"); }
              span { text "解码"; }
            }
          }
        }
        div(class = "control-group") {
          span(class = "control-label") { text "字符集"; }
          div(class = "segmented") {
            button(
              class = "seg" + (variant == "standard" ? " seg--active" : ""),
              on:click = { setVariant("standard"); }
            ) { text "标准"; }
            button(
              class = "seg" + (variant == "url" ? " seg--active" : ""),
              on:click = { setVariant("url"); }
            ) { text "URL 安全"; }
          }
        }
        div(class = "control-group") {
          button(class = "btn", on:click = { loadSample(); }) {
            svg(class = "icon") { use(href = "#i-sparkles"); }
            span { text "示例"; }
          }
          button(
            class = "btn",
            style = { borderColor: accent, background: accent, color: "#101014" },
            on:click = { cycleAccent(); }
          ) {
            svg(class = "icon") { use(href = "#i-palette"); }
            span { text "强调色"; }
          }
        }
      }

      section(class = "workspace") {

        article(class = "panel") {
          header(class = "panel-head") {
            div(class = "panel-title") {
              svg(class = "icon") { use(href = "#i-type"); }
              span { text "输入"; }
            }
            span(class = "counter") { text string(inputChars) + " 字符"; }
          }
          textarea(
            class = "editor",
            bind:value = input,
            placeholder = mode == "encode" ? "在此输入要编码的文本…" : "在此粘贴要解码的 Base64…",
            attr:spellcheck = "false",
            attr:autocomplete = "off",
            attr:autocapitalize = "off",
            aria:label = "输入内容"
          );
          footer(class = "panel-foot") {
            button(class = "btn", on:click = { clearInput(); }) {
              svg(class = "icon") { use(href = "#i-eraser"); }
              span { text "清空"; }
            }
            button(class = "btn", on:click = { swap(); }) {
              svg(class = "icon") { use(href = "#i-swap"); }
              span { text "交换"; }
            }
          }
        }

        article(class = "panel") {
          header(class = "panel-head") {
            div(class = "panel-title") {
              svg(class = "icon") { use(href = "#i-hash"); }
              span { text "输出"; }
            }
            span(class = "counter") { text string(outputChars) + " 字符"; }
          }
          div(class = outputClass) {
            when (output.ok) {
              when (outputChars > 0) {
                pre(class = "output-text") { text outputText; }
              } else {
                div(class = "output-empty") {
                  svg(class = "icon icon--lg") { use(href = "#i-sparkles"); }
                  span { text "结果会实时显示在这里"; }
                }
              }
            } else {
              div(class = "output-error") {
                svg(class = "icon") { use(href = "#i-alert"); }
                span { text outputError; }
              }
            }
          }
          footer(class = "panel-foot") {
            button(
              class = "btn btn--primary",
              prop:disabled = outputChars == 0,
              on:click = { copyOutput(); }
            ) {
              svg(class = "icon") { use(href = "#i-copy"); }
              span { text "复制"; }
            }
            button(
              class = "btn",
              prop:disabled = outputChars == 0,
              on:click = { saveEntry(); }
            ) {
              svg(class = "icon") { use(href = "#i-save"); }
              span { text "保存"; }
            }
            label(class = "toggle") {
              input(type = "checkbox", bind:checked = outputWrap);
              span { text "自动换行"; }
            }
          }
        }

      }

      section(class = "grid-2") {

                    span(class = "history-size") {
                      text string(entry.size) + " 字符 · " + entry.time;
                    }
                  }
                  code(class = "history-preview") { text entry.preview; }

                div(class = "history-actions") {

      footer(class = "footer") {
        span { text "source → bytecode → verify → link → vm" }
        span(class = "dot") { text "•" }

        span { text "route " + routePath; }
        when (clock != "") {
          span(class = "dot") { text "•" }
          span(class = "clock") { text clock; }

      }

      when (toast != "") {

    }
  }

<!-- ============================================================
     宿主层：编译 → 序列化 → 验证 → VM 挂载 + capability 注入
     ============================================================ -->
<script type="module">
import JLC, { JLCVM, loadModule, OP_SPEC } from "./jlc.js";

/* ============================================================
   1. 原生能力：内核无法实现的部分，唯一信任边界
   ============================================================ */

const textEncoder = new TextEncoder();
const textDecoder = new TextDecoder();

function bytesToBinary(bytes) {
  let binary = "";
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return binary;
}

function toBase64(text, urlSafe) {
  const bytes = textEncoder.encode(String(text ?? ""));
  let out = btoa(bytesToBinary(bytes));
  if (urlSafe) out = out.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return out;
}

function fromBase64(text, urlSafe) {
  let value = String(text ?? "").trim();
  if (value === "") return { ok: true, value: "" };

  if (urlSafe) value = value.replace(/-/g, "+").replace(/_/g, "/");
  value = value.replace(/\s+/g, "");

  if (!/^[A-Za-z0-9+/]*={0,2}$/.test(value)) {
    return { ok: false, error: "输入包含非 Base64 字符，请检查是否有空格或标点混入。" };
  }
  const remainder = value.length % 4;
  if (remainder === 1) {
    return { ok: false, error: "Base64 长度无效（长度除以 4 余 1），请检查是否缺少字符。" };
  }
  if (remainder !== 0) value += "=".repeat(4 - remainder);

  let binary;
  try {
    binary = atob(value);
  } catch (error) {
    return { ok: false, error: "无法解码：Base64 结构不合法。" };
  }

  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
  return { ok: true, value: textDecoder.decode(bytes) };
}

function fallbackCopy(text) {
  try {
    const area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.top = "-1000px";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    area.setSelectionRange(0, area.value.length);
    const ok = document.execCommand("copy");
    area.remove();
    return ok;
  } catch (error) {
    return false;
  }
}

/* resource 自检数据：离线可用、瞬时完成、必定成功 */
const DEMO_PAYLOAD = JSON.stringify({
  kernel: "JLC",
  version: "0.2.0",
  pipeline: ["tokenize", "parse", "optimize", "codegen", "verify", "link", "execute"],
  sandbox: { eval: false, innerHTML: false, prototypeAccess: false },
  reactive: { signal: true, effect: true, scope: true, scheduler: "microtask" }
});
const DEMO_ENDPOINT = "data:application/json," + encodeURIComponent(DEMO_PAYLOAD);

/* handle 引用：capability 需要读取实时内核指标 */
let appHandle = null;

const capabilities = {
  b64encode: (text, urlSafe) => ({ ok: true, value: toBase64(text, Boolean(urlSafe)) }),

  b64decode: (text, urlSafe) => fromBase64(text, Boolean(urlSafe)),

  copyText: (text) => {
    const value = String(text ?? "");
    try {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(value).catch(() => fallbackCopy(value));
        return true;
      }
    } catch (error) {
      /* 走兼容路径 */
    }
    return fallbackCopy(value);
  },

  applyTheme: (value) => {
    const next = String(value ?? "") === "dark" ? "dark" : "light";
    document.documentElement.dataset.theme = next;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", next === "dark" ? "#0d0d12" : "#ffd60a");
    try {
      localStorage.setItem("jlc-b64-theme", next);
    } catch (error) {
      /* 隐私模式下忽略 */
    }
    return next;
  },

  currentTime: () => {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  },

  /* 内核指标：把 handle.inspect() 暴露给 JLC 状态图 */
  kernelStats: () => {
    if (!appHandle) {
      return { scopes: 0, effects: 0, listeners: 0, timers: 0, requests: 0 };
    }
    const m = appHandle.inspect();
    return {
      scopes: m.scopes,
      effects: m.effects,
      listeners: m.listeners,
      timers: m.timers,
      requests: m.requests
    };
  },

  /* 供 resource 使用的内联端点 */
  demoEndpoint: () => DEMO_ENDPOINT
};

/* ============================================================
   2. 编译管线：compile → serialize → verify → mount
   ============================================================ */

const boot = document.getElementById("boot");
const appRoot = document.getElementById("app");
const sourceNode = document.getElementById("jlc-source");
const startedAt = performance.now();

function dismissBoot() {
  const elapsed = performance.now() - startedAt;
  const wait = Math.max(0, 1250 - elapsed);
  window.setTimeout(() => {
    if (!boot) return;
    boot.classList.add("boot--done");
    window.setTimeout(() => boot.remove(), 700);
  }, wait);
}

function renderFatal(error) {
  appRoot.textContent = "";
  const pre = document.createElement("pre");
  pre.className = "fatal";
  pre.textContent = "启动失败\n" + (error && error.message ? error.message : String(error));
  appRoot.appendChild(pre);
  dismissBoot();
}

try {
  const sourceText = sourceNode.textContent;
  const sourceName = "base64-studio.jlc";

  /* --- 阶段 1：编译（Tokenizer → Parser → 优化器 → Code Generator → Verifier） --- */
  const t0 = performance.now();
  const program = JLC.compile(sourceText, { sourceName });
  const t1 = performance.now();

  /* --- 阶段 2：序列化（模块 → .jbc 二进制） --- */
  const bytes = program.serialize();
  const t2 = performance.now();

  /* --- 阶段 3：载入（解码 + 验证器重新校验，得到冻结模块） --- */
  const module = loadModule(bytes, { sourceName: "base64-studio.jbc" });
  const t3 = performance.now();

  /* --- 阶段 4：VM 挂载（Linker → 栈式调度循环 → DOM） --- */
  const handle = JLCVM.mount(module, appRoot, {
    state: {
      theme: document.documentElement.dataset.theme === "dark" ? "dark" : "light",
      kernelVersion: JLC.version ?? "0.2.0"
    },
    capabilities,
    onError: (error) => {
      console.error("[JLC]", error);
    }
  });
  appHandle = handle;
  const t4 = performance.now();

  /* 启动根作用域时钟（every 定时器 + 实时内核指标） */
  handle.call("startTicker");

  /* 同步一次主题，保证 meta 与 localStorage 一致 */
  capabilities.applyTheme(document.documentElement.dataset.theme);

  /* ============================================================
     3. JBC 检查器：把编译产物摊开给用户看
     ============================================================ */

  (() => {
    const stats = document.getElementById("jbc-stats");
    const histogramNode = document.getElementById("jbc-histogram");
    const disassembly = document.getElementById("jbc-disassembly");
    const summaryText = document.getElementById("jbc-summary-text");
    if (!stats || !disassembly) return;

    const magic = [...bytes.slice(0, 4)].map((b) => b.toString(16).padStart(2, "0")).join(" ");
    const ratio = Math.round((1 - bytes.length / sourceText.length) * 100);

    let instructionBytes = 0;
    const histogram = new Map();
    for (const func of module.functions) {
      instructionBytes += func.code.length;
      for (const byte of func.code) {
        const spec = OP_SPEC?.[byte];
        if (spec) histogram.set(spec.name, (histogram.get(spec.name) ?? 0) + 1);
      }
    }

    const fmt = (n) => (Math.round(n * 100) / 100).toFixed(2) + " ms";

    const statsItems = [
      ["魔数", magic, "accent"],
      ["源码", sourceText.length + " 字符", ""],
      ["字节码", bytes.length + " 字节", "green"],
      ["压缩率", ratio + "%", "pink"],
      ["函数数", String(module.functions.length), "blue"],
      ["常量池", String(module.pool.length) + " 项", ""],
      ["全局引用", String(module.globalRefs.length) + " 项", ""],
      ["指令流", instructionBytes + " 字节", ""],
      ["compile()", fmt(t1 - t0), ""],
      ["serialize()", fmt(t2 - t1), ""],
      ["loadModule()", fmt(t3 - t2), ""],
      ["JLCVM.mount()", fmt(t4 - t3), ""]
    ];

    for (const [label, value, color] of statsItems) {
      const box = document.createElement("div");
      box.className = "jbc-stat";
      const labelNode = document.createElement("span");
      labelNode.className = "jbc-stat-label";
      labelNode.textContent = label;
      const valueNode = document.createElement("span");
      valueNode.className = "jbc-stat-value" + (color ? " jbc-stat-value--" + color : "");
      valueNode.textContent = value;
      box.appendChild(labelNode);
      box.appendChild(valueNode);
      stats.appendChild(box);
    }

    const top = [...histogram.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
    const max = top.length ? top[0][1] : 1;
    for (const [name, count] of top) {
      const bar = document.createElement("span");
      bar.className = "jbc-bar";
      const nameNode = document.createElement("span");
      nameNode.className = "jbc-bar-name";
      nameNode.textContent = name;
      const track = document.createElement("span");
      track.className = "jbc-bar-track";
      const fill = document.createElement("i");
      fill.className = "jbc-bar-fill";
      fill.style.width = Math.max(6, Math.round((count / max) * 100)) + "%";
      track.appendChild(fill);
      const countNode = document.createElement("span");
      countNode.textContent = "×" + count;
      bar.appendChild(nameNode);
      bar.appendChild(track);
      bar.appendChild(countNode);
      histogramNode.appendChild(bar);
    }

    disassembly.textContent = program.disassemble();

    if (summaryText) {
      summaryText.textContent =
        `已验证 · ${module.functions.length} 函数 · ${module.pool.length} 常量 · ` +
        `${bytes.length} 字节 · 挂载 ${fmt(t4 - t3)} · 点击展开指令集`;
    }

    window.__jlcBytecode = {
      module,
      bytes,
      timings: { compile: t1 - t0, serialize: t2 - t1, verify: t3 - t2, mount: t4 - t3 }
    };
  })();

  /* 页面隐藏时立即卸载：所有 scope/effect/listener/timer/request 归零 */
  window.addEventListener("pagehide", () => handle.unmount(), { once: true });

  /* 调试入口 */
  window.__jlcApp = handle;

  dismissBoot();
} catch (error) {
  console.error("[JLC] 启动失败", error);
  renderFatal(error);
}
</script>
