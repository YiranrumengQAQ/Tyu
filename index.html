<title>肛塞使用 · 安全教学 · 黏土拟物 · JLC 0.3</title>

<style>
  html, body { margin: 0; padding: 0; }
  body { min-height: 100dvh; background: #fdf9f4; }
  *, *::before, *::after { box-sizing: border-box; }
  ::selection { background: #ffc9de; color: #4b3b54; }
</style>
</head>

<body>

<div id="app"></div>

<script type="text/jlc" data-target="#app">
app ClayGuide {
  state tab = "guide";
  state read = {};
  state checks = {};
  state openId = 1;
  state toast = "";
  state toastKind = "info";
  state material = "silicone";
  state lube = "water";
  state timerOn = false;
  state seconds = 0;

  derive sections = [
    {
      id: 1,
      icon: "🌱",
      title: "开始之前：先把节奏放慢",
      lead: "肛门括约肌是一圈对情绪和紧张极其敏感的肌肉。这件事的第一步不是「放进去」，而是让自己确信：任何时候喊停都可以，而且不需要理由。",
      points: [
        "选一个私密、不会被打断、没有时间压力的环境。",
        "剪短指甲、洗净双手；用手的话建议戴一次性指套。",
        "事先排空膀胱与肠道，能明显降低不适和意外。",
        "不舒服就停。不需要「忍一下」——忍耐不是入门的一部分。"
      ]
    },
    {
      id: 2,
      icon: "🧊",
      title: "材质怎么挑",
      lead: "材质决定了清洁难度、顺滑程度，以及它能和哪一类润滑剂放在一起用。",
      points: [
        "医用硅胶：柔软亲肤、易清洁，与水基和混合型润滑剂都相容，入门首选。",
        "硼硅玻璃与不锈钢：表面极光滑，可彻底消毒，还能温可冷；但质地硬，进入时必须更慢。",
        "TPE / TPR / 橡胶：多孔材质，洗不彻底、容易藏菌，不建议长期反复使用。",
        "不管哪一种，底座都要明显宽于入口，避免整根滑入。"
      ]
    },
    {
      id: 3,
      icon: "💧",
      title: "润滑剂是必需品，不是可选项",
      lead: "肛门不会自己分泌润滑。没有润滑，摩擦会直接变成撕裂。",
      points: [
        "水基：最百搭，和所有材质相容；缺点是会被吸收、逐渐变干，需要中途补涂。",
        "硅基：最持久顺滑，但不能和硅胶玩具一起用——它会溶胀、腐蚀硅胶表面。",
        "混合型：兼顾顺滑与好清洗，多数情况下最省心。",
        "用量宁多勿少。感觉有点涩了就该补，别等到疼才补。"
      ]
    },
    {
      id: 4,
      icon: "🧼",
      title: "清洁与卫生：用前用后都要做",
      lead: "这一节没有商量余地。做得干净，感染和不适的概率会下降一个量级。",
      points: [
        "每次使用前后都清洗玩具。温水加中性清洁剂，或专用玩具清洁液。",
        "玻璃和不锈钢可以煮沸消毒；硅胶可以煮沸，或用 70% 酒精擦拭（先在边角试一下）。",
        "带电池或马达的部分通常不能进水，按说明书擦拭即可。",
        "洗完后彻底晾干再收纳。潮湿是细菌最喜欢的储存条件。"
      ]
    },
    {
      id: 5,
      icon: "📏",
      title: "循序渐进：一次只加一点点",
      lead: "尺寸的进阶单位是毫米，不是「号」。跳过中间步骤换来的通常不是快感，而是撕裂。",
      points: [
        "从你能找到的最细的开始，哪怕它看起来「太小了」。",
        "可以先用手指（剪短指甲、戴指套）做适应，感受肌肉放松的过程。",
        "适应几天到几周再换下一个尺寸，不要在一天里连升两级。",
        "每次只增加一点点，身体没有抗议才算过关。"
      ]
    },
    {
      id: 6,
      icon: "🌬️",
      title: "放松与呼吸：呼气时进入",
      lead: "括约肌是随意志收缩的，但它更听情绪的话。越用力，它关得越紧。",
      points: [
        "呼气的时候缓慢推进，吸气的时候停住不动。",
        "遇到阻力就退回来一点，不要硬顶。",
        "反向用力——像排便那样轻轻往外推——反而能让括约肌松开。",
        "紧张的时候任何尺寸都会变得不可能。先让身体安静下来。"
      ]
    },
    {
      id: 7,
      icon: "🚦",
      title: "身体信号：什么时候必须停",
      lead: "胀满感和轻微压迫感是正常的。疼痛不是。学会区分这两件事。",
      points: [
        "可以继续：温热感、胀满感、轻微的压迫感，且你还能正常呼吸和说话。",
        "必须立刻停：锐痛、撕裂感、出血、头晕、恶心、冒冷汗。",
        "疼痛不是「适应」的必要代价，它是身体在报警。",
        "停不下来的时候，先慢慢取出，再评估要不要就医。"
      ]
    },
    {
      id: 8,
      icon: "⏱️",
      title: "佩戴时间：别太久",
      lead: "长时间压迫会让局部血液循环变差，也可能让肌肉疲劳到无法自行回缩。",
      points: [
        "第一次别超过 15 到 20 分钟。",
        "逐渐延长，单次一般不建议超过 2 小时。",
        "不要戴着睡觉，也不要在无法及时取出的场合使用。",
        "设一个闹钟提醒自己。下一页的计时器就是为这个准备的。"
      ]
    },
    {
      id: 9,
      icon: "🧺",
      title: "取出、护理与收纳",
      lead: "取出和放入一样需要耐心，而且同样需要放松和润滑。",
      points: [
        "取出时同样缓慢，配合呼气，不要猛拉。",
        "取出后用温水清洗局部，检查有没有血迹或持续不适。",
        "玩具洗净、彻底晾干，单独放进布袋或收纳盒，避免和其他物品摩擦。",
        "用过的润滑剂残留在表面会吸附灰尘，收纳前要擦干净。"
      ]
    },
    {
      id: 10,
      icon: "🏥",
      title: "这些情况请去看医生",
      lead: "大部分不适是短暂的。但有些信号不该自己扛过去。",
      points: [
        "出血不止，或者血量较多、颜色鲜红。",
        "疼痛持续超过一两天没有缓解。",
        "出现发热、寒战、局部红肿发热。",
        "有痔疮、肛裂、炎症性肠病，或近期做过肛门手术——开始之前先咨询医生。"
      ]
    }
  ];

  derive checklist = [
    { id: "c1", text: "环境私密，不会被打断" },
    { id: "c2", text: "指甲剪短，双手洗净" },
    { id: "c3", text: "玩具已清洗并完全晾干" },
    { id: "c4", text: "备好足量、与材质相容的润滑剂" },
    { id: "c5", text: "从最小尺寸开始，没有跳级" },
    { id: "c6", text: "清楚知道不舒服就停，不需要理由" },
    { id: "c7", text: "设好了计时提醒" },
    { id: "c8", text: "事后会清洗并检查身体" }
  ];

  derive verdictTable = {
    "silicone/water": "相容。水基最百搭，但会被吸收变干，中途记得补涂。",
    "silicone/silicone": "不要这样用。硅基润滑剂会溶胀并腐蚀硅胶表面。",
    "silicone/hybrid": "相容。混合型兼顾顺滑与好清洗，和硅胶配合很好。",
    "glass/water": "相容。玻璃不吸水，水基干得快，可以多备一点。",
    "glass/silicone": "相容。硅基持久顺滑，配上光滑的玻璃体验很顺。",
    "glass/hybrid": "相容。混合型在这组里几乎没有短板。",
    "steel/water": "相容。不锈钢导热快，冬天可以先用手温一下。",
    "steel/silicone": "相容。硅基顺滑，金属表面光滑，阻力很小。",
    "steel/hybrid": "相容。注意金属会带走热量，润滑剂可以稍微多些。",
    "tpe/water": "相容，但 TPE 是多孔材质，洗不彻底、容易藏菌，不建议长期使用。",
    "tpe/silicone": "不要这样用。硅基会加速 TPE 老化，而且多孔材质的卫生风险始终存在。",
    "tpe/hybrid": "相容，但多孔材质本身的卫生问题不会因为润滑剂而消失。"
  };

  derive total = len(sections);
  derive readCount = countTrue(read);
  derive checkCount = countTrue(checks);
  derive progress = total == 0 ? 0 : floor(readCount * 100 / total);
  derive checkTotal = len(checklist);
  derive mm = floor(seconds / 60);
  derive ss = seconds % 60;
  derive clock = string(mm) + ":" + (ss < 10 ? "0" + string(ss) : string(ss));
  derive overTime = seconds >= 7200;
  derive nearTime = seconds >= 1200 && seconds < 7200;
  derive materialName = material == "silicone" ? "医用硅胶" : (material == "glass" ? "硼硅玻璃" : (material == "steel" ? "不锈钢" : "TPE / 橡胶"));
  derive lubeName = lube == "water" ? "水基" : (lube == "silicone" ? "硅基" : "混合型");
  derive verdict = get(verdictTable, material + "/" + lube, "请选择材质与润滑剂。");
  derive isWarn = slice(verdict, 0, 2) == "不要";

  style `
    .cg-root {
      --ink: #4b3b54;
      --ink-soft: #8b7b95;
      position: relative;
      min-height: 100dvh;
      padding: clamp(16px, 3.5vw, 46px) clamp(12px, 3vw, 38px) 90px;
      color: var(--ink);
      font-family: "SF Pro Rounded", ui-rounded, "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.78;
      background:
        radial-gradient(1100px 700px at 10% -8%, #ffe6f1 0%, rgba(255, 230, 241, 0) 58%),
        radial-gradient(900px 720px at 98% 6%, #e9e2ff 0%, rgba(233, 226, 255, 0) 60%),
        radial-gradient(1000px 820px at 48% 110%, #dcf5ec 0%, rgba(220, 245, 236, 0) 58%),
        #fdf9f4;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .cg-root * { box-sizing: border-box; }

    .cg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: .5;
      pointer-events: none;
      z-index: 0;
    }
    .cg-blob--1 { width: 360px; height: 360px; top: -130px; left: -110px; background: #ffcfe3; }
    .cg-blob--2 { width: 420px; height: 420px; bottom: -180px; right: -140px; background: #cfe4ff; }
    .cg-blob--3 { width: 300px; height: 300px; top: 42%; right: -120px; background: #d6f4e6; }

    .cg-inner {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(18px, 2.6vw, 28px);
    }

    .cg-clay {
      border-radius: 34px;
      background: linear-gradient(152deg, #ffffff 0%, #fff6fa 52%, #f4efff 100%);

        14px 16px 34px rgba(158, 130, 172, .26),
        -8px -8px 20px rgba(255, 255, 255, .92),
        inset -6px -6px 14px rgba(255, 255, 255, .95),
        inset 6px 8px 18px rgba(158, 130, 172, .12);
    }

    .cg-hero {
      position: relative;

      box-shadow:
        inset -10px -12px 26px rgba(255, 255, 255, .95),
        inset 10px 12px 30px rgba(168, 138, 180, .22),

        inset 5px 6px 14px rgba(158, 130, 172, .24),

    .cg-tab--on {

        inset 6px 7px 16px rgba(158, 130, 172, .26),

    }

    .cg-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(14px, 2vw, 20px);
    }
    @media (min-width: 860px) {
      .cg-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    }

      transform: translateY(-3px);
      box-shadow:
        16px 18px 36px rgba(158, 130, 172, .28),

      user-select: none;
    }

        6px 7px 15px rgba(158, 130, 172, .24),
        -5px -5px 12px rgba(255, 255, 255, .95),
        inset -3px -3px 8px rgba(255, 255, 255, .9),
        inset 3px 4px 9px rgba(158, 130, 172, .12);

      box-shadow:
        inset 4px 5px 11px rgba(158, 130, 172, .22),

        inset 5px 6px 14px rgba(158, 130, 172, .16),
        inset -5px -6px 14px rgba(255, 255, 255, .95);

    .cg-points {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cg-points li {
      position: relative;
      padding: 11px 14px 11px 40px;
      border-radius: 14px;
      font-size: 13.5px;
      color: #55445f;
      background: linear-gradient(150deg, #ffffff, #fdf7fb);
      box-shadow:
        5px 6px 13px rgba(158, 130, 172, .16),
        -4px -4px 10px rgba(255, 255, 255, .92),
        inset -3px -3px 8px rgba(255, 255, 255, .85);
    }
    .cg-points li::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 20px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(150deg, #ffb6d5, #c9b4ff);
      box-shadow:
        inset -2px -2px 4px rgba(255, 255, 255, .85),
        inset 2px 2px 5px rgba(140, 110, 160, .3);
    }

    .cg-btn {
      align-self: flex-start;
      padding: 11px 22px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .04em;
      color: #5b4a67;
      background: linear-gradient(150deg, #ffffff, #f5eefb);
      box-shadow:
        7px 8px 17px rgba(158, 130, 172, .24),
        -5px -5px 12px rgba(255, 255, 255, .95),
        inset -3px -3px 8px rgba(255, 255, 255, .92),
        inset 3px 4px 9px rgba(158, 130, 172, .1);
      transition: transform .18s cubic-bezier(.2, .85, .25, 1), box-shadow .18s;
    }
    .cg-btn:hover { transform: translateY(-2px); }
    .cg-btn:active {
      transform: translateY(1px);
      box-shadow:
        inset 6px 7px 15px rgba(158, 130, 172, .26),
        inset -6px -7px 15px rgba(255, 255, 255, .95);
    }
    .cg-btn--primary {
      color: #4a3753;
      background: linear-gradient(150deg, #ffd9ec, #d9cbff);
    }
    .cg-btn--done {
      color: #2f7a5c;
      background: linear-gradient(150deg, #d6f6e8, #eafff6);
    }
    .cg-btn--ghost {
      color: #8b7b95;
      background: linear-gradient(150deg, #ffffff, #f8f4fb);
    }

    .cg-panel {
      padding: clamp(20px, 3vw, 32px);
      border-radius: 34px;
      background: linear-gradient(152deg, #ffffff 0%, #fdf6ff 100%);
      box-shadow:
        14px 16px 34px rgba(158, 130, 172, .24),
        -8px -8px 20px rgba(255, 255, 255, .92),
        inset -5px -5px 13px rgba(255, 255, 255, .95),
        inset 5px 7px 16px rgba(158, 130, 172, .11);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .cg-panel-title {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      color: #46354f;
    }
    .cg-panel-sub {
      margin: -10px 0 0;
      font-size: 13px;
      color: var(--ink-soft);
    }

    .cg-check-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .cg-check {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 17px;
      border-radius: 18px;
      cursor: pointer;
      user-select: none;
      background: linear-gradient(150deg, #ffffff, #fdf7fb);
      box-shadow:
        6px 7px 15px rgba(158, 130, 172, .18),
        -5px -5px 12px rgba(255, 255, 255, .95),
        inset -3px -3px 8px rgba(255, 255, 255, .88);
      transition: transform .2s cubic-bezier(.2, .85, .25, 1), box-shadow .2s;
    }
    .cg-check:hover { transform: translateY(-2px); }
    .cg-check--on {
      background: linear-gradient(150deg, #e8fbf2, #ffffff);
      box-shadow:
        inset 6px 7px 15px rgba(120, 180, 155, .24),
        inset -6px -7px 15px rgba(255, 255, 255, .98);
    }
    .cg-check input {
      appearance: none;
      -webkit-appearance: none;
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      margin: 0;
      border-radius: 10px;
      cursor: pointer;
      background: linear-gradient(150deg, #ffffff, #f2ebf8);
      box-shadow:
        inset 4px 5px 11px rgba(158, 130, 172, .24),
        inset -4px -5px 11px rgba(255, 255, 255, .95);
      position: relative;
      transition: background .2s;
    }
    .cg-check input:checked {
      background: linear-gradient(150deg, #a8ecd0, #7ed8b2);
      box-shadow:
        inset 3px 4px 9px rgba(60, 140, 110, .3),
        inset -3px -4px 9px rgba(255, 255, 255, .5);
    }
    .cg-check input:checked::after {
      content: "";
      position: absolute;
      left: 9px;
      top: 4px;
      width: 7px;
      height: 13px;
      border-right: 3px solid #ffffff;
      border-bottom: 3px solid #ffffff;
      border-radius: 2px;
      transform: rotate(42deg);
    }
    .cg-check span {
      font-size: 14px;
      color: #55445f;
      transition: color .2s, opacity .2s;
    }
    .cg-check--on span { color: #2f7a5c; }

    .cg-choice {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .cg-choice-label {
      flex: 0 0 84px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #ad9cb8;
    }
    .cg-chip {
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      color: #7a6886;
      background: linear-gradient(150deg, #ffffff, #f7f1fb);
      box-shadow:
        5px 6px 14px rgba(158, 130, 172, .2),
        -4px -4px 10px rgba(255, 255, 255, .95),
        inset -3px -3px 8px rgba(255, 255, 255, .9);
      transition: transform .18s cubic-bezier(.2, .85, .25, 1), box-shadow .18s, color .18s;
    }
    .cg-chip:hover { transform: translateY(-2px); }
    .cg-chip--on {
      color: #4a3753;
      background: linear-gradient(150deg, #ffd9ec, #dcd0ff);
      box-shadow:
        inset 5px 6px 14px rgba(158, 130, 172, .26),
        inset -5px -6px 14px rgba(255, 255, 255, .95);
    }

    .cg-verdict {
      padding: 18px 20px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.7;
      color: #4a3753;
      background: linear-gradient(150deg, #eefaf4, #ffffff);
      box-shadow:
        inset 6px 7px 16px rgba(120, 180, 155, .2),
        inset -6px -7px 16px rgba(255, 255, 255, .95);
      transition: background .3s;
    }
    .cg-verdict--warn {
      color: #7a3f4e;
      background: linear-gradient(150deg, #ffeef2, #ffffff);
      box-shadow:
        inset 6px 7px 16px rgba(200, 120, 145, .22),
        inset -6px -7px 16px rgba(255, 255, 255, .95);
    }

    .cg-timer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }
    .cg-clock {
      display: grid;
      place-items: center;
      width: clamp(180px, 40vw, 240px);
      height: clamp(180px, 40vw, 240px);
      border-radius: 50%;
      font-size: clamp(38px, 9vw, 58px);
      font-weight: 800;
      letter-spacing: .02em;
      color: #4a3753;
      font-variant-numeric: tabular-nums;
      background: radial-gradient(circle at 34% 28%, #ffffff, #ffe9f4 56%, #e6dbff);
      box-shadow:
        16px 18px 38px rgba(158, 130, 172, .28),
        -10px -10px 24px rgba(255, 255, 255, .95),
        inset -8px -8px 20px rgba(255, 255, 255, .95),
        inset 8px 10px 24px rgba(158, 130, 172, .16);
    }
    .cg-clock--near {
      background: radial-gradient(circle at 34% 28%, #ffffff, #fff3d6 56%, #ffe3b8);
    }
    .cg-clock--over {
      background: radial-gradient(circle at 34% 28%, #ffffff, #ffe3e6 56%, #ffc9d4);
      color: #8a3348;
    }
    .cg-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .cg-warn {
      padding: 15px 20px;
      border-radius: 16px;
      font-size: 13.5px;
      font-weight: 700;
      color: #8a3348;
      background: linear-gradient(150deg, #ffe9ee, #fff6f8);
      box-shadow:
        inset 6px 7px 15px rgba(200, 120, 145, .2),
        inset -6px -7px 15px rgba(255, 255, 255, .95);
      animation: cgPulse 2s ease-in-out infinite;
    }
    @keyframes cgPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .cg-hint {
      margin: 0;
      max-width: 46ch;
      font-size: 13px;
      color: var(--ink-soft);
    }

    .cg-toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 11px;
      max-width: calc(100vw - 36px);
      padding: 14px 24px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 700;
      color: #4a3753;
      background: linear-gradient(150deg, #ffffff, #f6eeff);
      box-shadow:
        12px 14px 30px rgba(158, 130, 172, .3),
        -6px -6px 16px rgba(255, 255, 255, .95),
        inset -4px -4px 10px rgba(255, 255, 255, .9);
      transform: translateX(-50%);
      animation: cgToast .34s cubic-bezier(.2, .85, .25, 1) both;
    }
    @keyframes cgToast {
      from { opacity: 0; transform: translate(-50%, 22px) scale(.94); }
      to { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
    .cg-toast-dot {
      flex: 0 0 auto;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #8fe3c4;
      box-shadow: 0 0 0 5px rgba(143, 227, 196, .26);
    }
    .cg-toast--ok .cg-toast-dot { background: #8fe3c4; box-shadow: 0 0 0 5px rgba(143, 227, 196, .26); }
    .cg-toast--info .cg-toast-dot { background: #b6c9ff; box-shadow: 0 0 0 5px rgba(182, 201, 255, .26); }
    .cg-toast--warn .cg-toast-dot { background: #ffd08a; box-shadow: 0 0 0 5px rgba(255, 208, 138, .26); }

    .cg-foot {
      padding: 20px 24px;
      border-radius: 24px;
      font-size: 12px;
      line-height: 1.8;
      color: var(--ink-soft);
      background: linear-gradient(150deg, #ffffff, #fbf6ff);
      box-shadow:
        8px 9px 20px rgba(158, 130, 172, .18),
        -5px -5px 13px rgba(255, 255, 255, .92),
        inset -4px -4px 10px rgba(255, 255, 255, .9);
    }
    .cg-foot b { color: #6d5a7a; }

    @media (max-width: 620px) {
      .cg-choice-label { flex: 0 0 100%; }
      .cg-tab { min-width: 0; padding: 11px 12px; font-size: 12.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cg-root *, .cg-root *::before, .cg-root *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  `;

  action countTrue(map) {
    let n = 0;
    for (k in keys(map)) {
      if (map[k]) {
        n += 1;
      }
    }
    return n;
  }

  action notify(message, kind = "info") {
    toast = message;
    toastKind = kind;
    after (2600) {
      if (toast == message) {
        toast = "";
      }
    }
  }

  action markRead(id) {
    read[id] = true;
    notify("第 " + string(id) + " 节已标记为已读", "ok");
  }

  action toggleCard(id) {
    if (openId == id) {
      openId = 0;
    } else {
      openId = id;
    }
  }

  action toggleCheck(id) {
    checks[id] = !checks[id];
  }

  action setMaterial(next) {
    material = next;
  }

  action setLube(next) {
    lube = next;
  }

  action toggleTimer() {
    if (timerOn) {
      timerOn = false;
      notify("计时已暂停 · " + clock, "info");
    } else {
      timerOn = true;
      notify("开始计时 · 单次建议不超过 2 小时", "ok");
    }
  }

  action resetTimer() {
    timerOn = false;
    seconds = 0;
    notify("计时已归零", "info");
  }

  action startTicker() {
    every (1000) {
      if (timerOn) {
        seconds += 1;
      }
    }
  }

  view {
    div(class = "cg-root") {

      div(class = "cg-blob cg-blob--1");
      div(class = "cg-blob cg-blob--2");
      div(class = "cg-blob cg-blob--3");

      div(class = "cg-inner") {

        header(class = "cg-clay cg-hero") {
          div(class = "cg-badge") {
            i();
            span { text "JLC 0.3 · 字节码虚拟机渲染"; }
          }
          h1(class = "cg-hero-title") {
            text "肛塞使用 · 安全教学";
          }
          p(class = "cg-hero-sub") {
            text "十节入门指南 · 一份自检清单 · 材质与润滑剂搭配提示 · 佩戴计时。全部界面与状态由 JLC 字节码驱动，没有 eval，没有 innerHTML。";
          }
          div(class = "cg-meter") {
            div(class = "cg-meter-track") {
              div(class = "cg-meter-fill", style:width = string(progress) + "%");
            }
            span(class = "cg-meter-text") {
              text "已读 " + string(readCount) + " / " + string(total) + " 节 · " + string(progress) + "%　|　清单 " + string(checkCount) + " / " + string(checkTotal);
            }
          }
        }

        nav(class = "cg-clay cg-tabs") {
          button(
            class = "cg-tab" + (tab == "guide" ? " cg-tab--on" : ""),
            on:click = { tab = "guide"; }
          ) {
            text "指南";
          }
          button(
            class = "cg-tab" + (tab == "check" ? " cg-tab--on" : ""),
            on:click = { tab = "check"; }
          ) {
            text "自检清单";
          }
          button(
            class = "cg-tab" + (tab == "pair" ? " cg-tab--on" : ""),
            on:click = { tab = "pair"; }
          ) {
            text "材质搭配";
          }
          button(
            class = "cg-tab" + (tab == "timer" ? " cg-tab--on" : ""),
            on:click = { tab = "timer"; }
          ) {
            text "佩戴计时";
          }
        }

        main(class = "cg-main") {

          when (tab == "guide") {
            div(class = "cg-grid") {
              each (section in sections key section.id) {
                article(class = "cg-card" + (openId == section.id ? " cg-card--open" : "")) {
                  header(class = "cg-card-head", on:click = { toggleCard(section.id); }) {
                    span(class = "cg-card-icon") { text section.icon; }
                    div(class = "cg-card-title") {
                      span(class = "cg-card-no") { text "第 " + string(section.id) + " 节"; }
                      h3 { text section.title; }
                    }
                    span(class = "cg-card-mark") {
                      text read[section.id] ? "✓" : "›";
                    }
                  }
                  when (openId == section.id) {
                    div(class = "cg-card-body") {
                      p(class = "cg-lead") { text section.lead; }
                      ul(class = "cg-points") {
                        each (point, pi in section.points key pi) {
                          li { text point; }
                        }
                      }
                      when (read[section.id]) {
                        button(class = "cg-btn cg-btn--done", on:click = { notify("这一节已经读过了", "info"); }) {
                          text "✓ 已读";
                        }
                      } else {
                        button(class = "cg-btn cg-btn--primary", on:click = { markRead(section.id); }) {
                          text "标记为已读";
                        }
                      }
                    }
                  }
                }
              }
            }
          }

          when (tab == "check") {
            section(class = "cg-panel") {
              h2(class = "cg-panel-title") { text "上手前的自检清单"; }
              p(class = "cg-panel-sub") {
                text "八条都勾上再开始。任何一条打不了勾，就先停下来处理它。";
              }
              div(class = "cg-check-list") {
                each (item in checklist key item.id) {
                  label(class = "cg-check" + (checks[item.id] ? " cg-check--on" : "")) {
                    input(
                      type = "checkbox",
                      prop:checked = checks[item.id] == true,
                      on:change = { toggleCheck(item.id); }
                    );
                    span { text item.text; }
                  }
                }
              }
              p(class = "cg-panel-sub") {
                text "已勾选 " + string(checkCount) + " / " + string(checkTotal) + " 项。";
              }
            }
          }

          when (tab == "pair") {
            section(class = "cg-panel") {
              h2(class = "cg-panel-title") { text "材质 × 润滑剂"; }
              p(class = "cg-panel-sub") {
                text "选错搭配是新手最常见的坑——硅基润滑剂会把硅胶玩具表面溶胀、腐蚀。";
              }

              div(class = "cg-choice") {
                span(class = "cg-choice-label") { text "玩具材质"; }
                button(
                  class = "cg-chip" + (material == "silicone" ? " cg-chip--on" : ""),
                  on:click = { setMaterial("silicone"); }
                ) { text "医用硅胶"; }
                button(
                  class = "cg-chip" + (material == "glass" ? " cg-chip--on" : ""),
                  on:click = { setMaterial("glass"); }
                ) { text "硼硅玻璃"; }
                button(
                  class = "cg-chip" + (material == "steel" ? " cg-chip--on" : ""),
                  on:click = { setMaterial("steel"); }
                ) { text "不锈钢"; }
                button(
                  class = "cg-chip" + (material == "tpe" ? " cg-chip--on" : ""),
                  on:click = { setMaterial("tpe"); }
                ) { text "TPE / 橡胶"; }
              }

              div(class = "cg-choice") {
                span(class = "cg-choice-label") { text "润滑剂"; }
                button(
                  class = "cg-chip" + (lube == "water" ? " cg-chip--on" : ""),
                  on:click = { setLube("water"); }
                ) { text "水基"; }
                button(
                  class = "cg-chip" + (lube == "silicone" ? " cg-chip--on" : ""),
                  on:click = { setLube("silicone"); }
                ) { text "硅基"; }
                button(
                  class = "cg-chip" + (lube == "hybrid" ? " cg-chip--on" : ""),
                  on:click = { setLube("hybrid"); }
                ) { text "混合型"; }
              }

              div(class = "cg-verdict" + (isWarn ? " cg-verdict--warn" : "")) {
                text materialName + " × " + lubeName + "： " + verdict;
              }
            }
          }

          when (tab == "timer") {
            section(class = "cg-panel") {
              h2(class = "cg-panel-title") { text "佩戴计时"; }
              p(class = "cg-panel-sub") {
                text "第一次控制在 15–20 分钟以内；单次一般不超过 2 小时。计时器归零不会影响已读进度。";
              }
              div(class = "cg-timer") {
                div(class = "cg-clock" + (overTime ? " cg-clock--over" : (nearTime ? " cg-clock--near" : ""))) {
                  text clock;
                }
                div(class = "cg-row") {
                  button(
                    class = "cg-btn " + (timerOn ? "cg-btn--ghost" : "cg-btn--primary"),
                    on:click = { toggleTimer(); }
                  ) {
                    text timerOn ? "暂停计时" : "开始计时";
                  }
                  button(class = "cg-btn cg-btn--ghost", on:click = { resetTimer(); }) {
                    text "归零";
                  }
                }
                when (overTime) {
                  div(class = "cg-warn") {
                    text "⏰ 已经两小时了。请慢慢取出，让身体休息。";
                  }
                } else {
                  when (nearTime) {
                    div(class = "cg-warn") {
                      text "⏳ 接近建议上限了，留意身体的感受。";
                    }
                  } else {
                    p(class = "cg-hint") {
                      text "计时运行时每秒刷新一次；这是 JLC 的 every 定时器，随应用卸载自动清除。";
                    }
                  }
                }
              }
            }
          }

        }

        footer(class = "cg-foot") {
          p() {
            text "本页由 JLC 0.3 内核驱动：源码先编译成 .jbc 字节码，再由栈式虚拟机验证、链接并渲染成响应式 DOM。状态、派生、事件与定时器全部跑在虚拟机上，页面里没有一行 eval，也没有 innerHTML。";
          }
          p() {
            text "内容仅供健康教育参考。若你有痔疮、肛裂、炎症性肠病，或近期做过肛门手术，请先咨询医生。";
          }
        }

      }

      when (toast != "") {
        div(class = "cg-toast cg-toast--" + toastKind, attr:role = "status") {
          span(class = "cg-toast-dot");
          span { text toast; }
        }
      }

    }
  }
}
</script>

<script type="module">
import JLC from "./jlc.js";

const appRoot = document.getElementById("app");

function renderFatal(error) {
  appRoot.textContent = "";
  const pre = document.createElement("pre");
  pre.style.cssText =
    "margin:24px auto;max-width:860px;padding:20px;font:500 13px/1.7 ui-monospace,monospace;" +
    "white-space:pre-wrap;border-radius:22px;background:#fff3f6;color:#8a3348;" +
    "box-shadow:10px 12px 26px rgba(158,130,172,.26),-6px -6px 16px rgba(255,255,255,.9);";
  pre.textContent = "启动失败\n" + (error?.message ?? String(error));
  appRoot.appendChild(pre);
}

try {
  const handles = await JLC.boot(document, {
    policy: "strict",
    fault: "stop",
    onError: (error) => console.error("[JLC]", error),
  });

  const handle = handles[0];
  handle.call("startTicker");

  window.__jlcApp = handle;
  window.addEventListener("pagehide", () => handle.unmount(), { once: true });
} catch (error) {
  console.error("[JLC] 启动失败", error);
  renderFatal(error);
}
</script>
