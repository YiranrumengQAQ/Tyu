<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffd60a" />
<meta name="description" content="BASE64 STUDIO — 由 JLC 内核驱动的纯前端 Base64 编解码工作台" />
<title>BASE64 STUDIO · JLC 内核</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ffd60a'/%3E%3Cpath d='M9 23 16 9l7 14' fill='none' stroke='%23101014' stroke-width='3'/%3E%3C/svg%3E" />

<style>
  /* ============================================================
     设计令牌
     ============================================================ */
  :root {
    color-scheme: light;
    --bg:        #f4efe4;
    --surface:   #fffdf8;
    --field:     #fffdf8;
    --ink:       #101014;
    --muted:     #6b6b7b;
    --border:    #101014;
    --shadow:    #101014;
    --hover:     #fff0b8;
    --accent:    #ffd60a;
    --pink:      #ff5c8a;
    --blue:      #4d7cff;
    --green:     #22c96b;
    --grid:      rgba(16, 16, 20, .07);
    --on-accent: #101014;

    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
            "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
            "Noto Sans Mono", "Courier New", monospace;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg:      #0e0e13;
    --surface: #191920;
    --field:   #131319;
    --ink:     #f3f1ea;
    --muted:   #9a9aad;
    --border:  #f3f1ea;
    --shadow:  #55556b;
    --hover:   #23232f;
    --accent:  #ffd60a;
    --pink:    #ff7aa2;
    --blue:    #82a7ff;
    --green:   #3ee08f;
    --grid:    rgba(243, 241, 234, .05);
  }

  /* ============================================================
     基础
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

  body {
    margin: 0;
    min-height: 100dvh;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.55;
    transition: background-color .3s ease, color .3s ease;
    overflow-x: hidden;
  }

  button, textarea, input { font-family: inherit; }

  ::selection { background: var(--accent); color: var(--on-accent); }

  /* ============================================================
     图标（内置 SVG symbol 图标库）
     ============================================================ */
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  .icon {
    width: 20px;
    height: 20px;
    flex: 0 0 auto;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .icon--lg { width: 26px; height: 26px; }

  /* ============================================================
     启动动画
     ============================================================ */
  .boot {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: grid;
    place-items: center;
    padding: 24px;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    transition: opacity .5s ease, visibility .5s ease;
  }
  .boot--done { opacity: 0; visibility: hidden; }

  .boot-card {
    padding: 34px 40px 30px;
    background: var(--surface);
    border: 3px solid var(--border);
    box-shadow: 9px 9px 0 var(--shadow);
    text-align: center;
    animation: bootIn .45s cubic-bezier(.2, .85, .25, 1) both;
  }
  @keyframes bootIn {
    from { opacity: 0; transform: translateY(18px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }

  .boot-blocks {
    display: flex;
    justify-content: center;
    gap: 9px;
    margin-bottom: 22px;
  }
  .boot-blocks i {
    width: 17px;
    height: 17px;
    background: var(--accent);
    border: 3px solid var(--border);
    box-shadow: 3px 3px 0 var(--shadow);
    animation: bootBounce 1.05s infinite ease-in-out;
  }
  .boot-blocks i:nth-child(2) { background: var(--pink);  animation-delay: .11s; }
  .boot-blocks i:nth-child(3) { background: var(--blue);  animation-delay: .22s; }
  .boot-blocks i:nth-child(4) { background: var(--green); animation-delay: .33s; }
  @keyframes bootBounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-13px) rotate(14deg); }
  }

  .boot-title {
    margin: 0 0 4px;
    font-size: 1.05rem;
    font-weight: 900;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .boot-sub {
    margin: 0 0 20px;
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .1em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .boot-track {
    width: min(240px, 60vw);
    height: 14px;
    margin: 0 auto 14px;
    background: var(--field);
    border: 3px solid var(--border);
    box-shadow: 3px 3px 0 var(--shadow);
    overflow: hidden;
  }
  .boot-track i {
    display: block;
    height: 100%;
    width: 0;
    background: repeating-linear-gradient(
      45deg,
      var(--accent) 0 9px,
      var(--pink) 9px 18px,
      var(--blue) 18px 27px,
      var(--green) 27px 36px
    );
    animation: bootFill 1.25s cubic-bezier(.55, 0, .25, 1) forwards;
  }
  @keyframes bootFill { to { width: 100%; } }

  .boot-hint {
    margin: 0;
    font-family: var(--mono);
    font-size: .72rem;
    color: var(--muted);
  }

  /* ============================================================
     应用外壳
     ============================================================ */
  .shell {
    max-width: 1180px;
    margin: 0 auto;
    padding: 22px 16px 72px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    animation: shellIn .55s cubic-bezier(.2, .85, .25, 1) both;
  }
  @keyframes shellIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    padding: 14px 18px;
    background: var(--surface);
    border: 3px solid var(--border);
    box-shadow: 7px 7px 0 var(--shadow);
  }

  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }

  .logo {
    display: grid;
    place-items: center;
    width: 50px;
    height: 50px;
    flex: 0 0 auto;
    background: var(--accent);
    color: var(--on-accent);
    border: 3px solid var(--border);
    box-shadow: 4px 4px 0 var(--shadow);
    transform: rotate(-4deg);
    transition: transform .25s cubic-bezier(.2, .85, .25, 1);
  }
  .topbar:hover .logo { transform: rotate(4deg) scale(1.04); }

  .brand-text { min-width: 0; }
  .brand-title {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .brand-sub {
    margin: 1px 0 0;
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .06em;
    color: var(--muted);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .topbar-right { display: flex; align-items: center; gap: 12px; }

  .badge {
    padding: 6px 12px;
    font-size: .68rem;
    font-weight: 900;
    letter-spacing: .12em;
    text-transform: uppercase;
    background: var(--blue);
    color: #fff;
    border: 3px solid var(--border);
    box-shadow: 3px 3px 0 var(--shadow);
    white-space: nowrap;
  }

  /* ---------- 按钮 ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    font-family: inherit;
    font-size: .78rem;
    font-weight: 900;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--surface);
    border: 3px solid var(--border);
    box-shadow: 4px 4px 0 var(--shadow);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: transform .12s ease, box-shadow .12s ease, background-color .15s ease;
  }
  .btn:hover  { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--shadow); }
  .btn:active { transform: translate(2px, 2px);   box-shadow: 1px 1px 0 var(--shadow); }
  .btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .btn--primary { background: var(--accent); color: var(--on-accent); }
  .btn--ghost   { background: transparent; }
  .btn--icon    { padding: 10px; }
  .btn--sm      { padding: 7px 11px; font-size: .7rem; box-shadow: 3px 3px 0 var(--shadow); }
  .btn--sm.btn--icon { padding: 7px; }
  .btn--sm .icon { width: 16px; height: 16px; }

  /* ---------- 控制条 ---------- */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 20px 32px;
    align-items: center;
    padding: 16px 18px;
    background: var(--surface);
    border: 3px solid var(--border);
    box-shadow: 7px 7px 0 var(--shadow);
  }
  .control-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .control-label {
    font-size: .68rem;
    font-weight: 900;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .segmented {
    display: inline-flex;
    background: var(--surface);
    border: 3px solid var(--border);
    box-shadow: 4px 4px 0 var(--shadow);
  }
  .seg {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 15px;
    font-family: inherit;
    font-size: .76rem;
    font-weight: 900;
    letter-spacing: .06em;
    color: var(--ink);
    background: transparent;
    border: none;
    border-right: 3px solid var(--border);
    cursor: pointer;
    transition: background-color .15s ease, color .15s ease;
  }
  .seg:last-child { border-right: none; }
  .seg:hover { background: var(--hover); }
  .seg--active { background: var(--accent); color: var(--on-accent); }
  .seg--active:hover { background: var(--accent); }
  .seg:focus-visible { outline: 3px solid var(--blue); outline-offset: -3px; }

  /* ---------- 工作区 ---------- */
  .workspace {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  @media (min-width: 880px) {
    .workspace { grid-template-columns: 1fr 1fr; }
  }

  .panel {
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--surface);
    border: 3px solid var(--border);
    box-shadow: 7px 7px 0 var(--shadow);
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 3px solid var(--border);
  }
  .panel-title {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: .78rem;
    font-weight: 900;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .panel-actions { display: flex; align-items: center; gap: 10px; }

  .counter {
    font-family: var(--mono);
    font-size: .7rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .editor {
    flex: 1 1 auto;
    width: 100%;
    min-height: 240px;
    padding: 16px;
    color: var(--ink);
    background: var(--field);
    border: none;
    outline: none;
    resize: vertical;
    font-family: var(--mono);
    font-size: .88rem;
    line-height: 1.65;
    transition: background-color .2s ease;
  }
  .editor:focus { background: var(--hover); }
  .editor::placeholder { color: var(--muted); opacity: .8; }

  .output {
    flex: 1 1 auto;
    min-height: 240px;
    max-height: 460px;
    padding: 16px;
    overflow: auto;
    background: var(--field);
  }
  .output-text {
    margin: 0;
    font-family: var(--mono);
    font-size: .88rem;
    line-height: 1.65;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .output-empty,
  .output-error {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 200px;
    justify-content: center;
    font-size: .82rem;
    color: var(--muted);
    text-align: center;
  }
  .output-error {
    align-items: flex-start;
    justify-content: flex-start;
    padding: 14px;
    color: var(--ink);
    background: color-mix(in srgb, var(--pink) 22%, transparent);
    border: 3px solid var(--border);
    box-shadow: 4px 4px 0 var(--shadow);
    font-family: var(--mono);
    font-size: .8rem;
  }
  .output-error .icon { color: var(--pink); }

  .panel-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 16px;
    border-top: 3px solid var(--border);
  }

  /* ---------- 历史 ---------- */
  .history {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 16px;
    border-top: 3px solid var(--border);
    transition: background-color .15s ease;
    animation: rowIn .3s cubic-bezier(.2, .85, .25, 1) both;
  }
  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: none; }
  }
  .history-item:first-child { border-top: none; }
  .history-item:hover { background: var(--hover); }

  .history-main { flex: 1 1 auto; min-width: 0; }
  .history-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }

  .chip {
    padding: 2px 9px;
    font-size: .64rem;
    font-weight: 900;
    letter-spacing: .1em;
    text-transform: uppercase;
    background: var(--accent);
    color: var(--on-accent);
    border: 2px solid var(--border);
  }
  .history-size {
    font-family: var(--mono);
    font-size: .68rem;
    color: var(--muted);
  }
  .history-preview {
    display: block;
    font-family: var(--mono);
    font-size: .78rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-actions { display: flex; gap: 8px; flex: 0 0 auto; }

  .history-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 34px 16px;
    color: var(--muted);
    font-size: .8rem;
    text-align: center;
  }
  .history-empty .icon { color: var(--muted); }

  /* ---------- 页脚 ---------- */
  .footer {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding-top: 6px;
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .05em;
    color: var(--muted);
    text-align: center;
  }
  .footer .dot { color: var(--accent); }

  /* ---------- JBC 字节码检查器 ---------- */
  .jbc-panel {
    margin: 18px auto 0;
    max-width: 1060px;
    border: 3px solid var(--border);
    background: var(--surface);
    box-shadow: 9px 9px 0 var(--shadow);
    font-family: var(--mono);
  }
  .jbc-panel > summary {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    font-size: .72rem;
    letter-spacing: .04em;
    color: var(--muted);
    user-select: none;
  }
  .jbc-panel > summary:hover { color: var(--ink); }
  .jbc-badge {
    display: inline-block;
    padding: 2px 8px;
    background: var(--accent);
    color: var(--on-accent);
    border: 2px solid var(--border);
    font-weight: 700;
    letter-spacing: .12em;
  }
  .jbc-body { border-top: 3px solid var(--border); padding: 14px 16px 18px; }
  .jbc-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    font-size: .7rem;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .jbc-stats b { color: var(--accent); }
  .jbc-disassembly {
    max-height: 320px;
    overflow: auto;
    margin: 0;
    padding: 12px;
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: .62rem;
    line-height: 1.5;
    white-space: pre;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    z-index: 60;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    max-width: calc(100vw - 32px);
    padding: 12px 20px;
    font-size: .8rem;
    font-weight: 800;
    letter-spacing: .03em;
    color: var(--ink);
    background: var(--surface);
    border: 3px solid var(--border);
    box-shadow: 5px 5px 0 var(--shadow);
    transform: translateX(-50%);
    animation: toastIn .28s cubic-bezier(.2, .85, .25, 1) both;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, 18px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  .toast--ok    { border-left-width: 12px; border-left-color: var(--green); }
  .toast--error { border-left-width: 12px; border-left-color: var(--pink); }
  .toast--info  { border-left-width: 12px; border-left-color: var(--blue); }
  .toast--ok    .icon { color: var(--green); }
  .toast--error .icon { color: var(--pink); }
  .toast--info  .icon { color: var(--blue); }

  /* ---------- 致命错误 ---------- */
  .fatal {
    margin: 24px;
    padding: 20px;
    font-family: var(--mono);
    font-size: .8rem;
    white-space: pre-wrap;
    background: var(--surface);
    border: 3px solid var(--border);
    box-shadow: 6px 6px 0 var(--shadow);
  }

  /* ============================================================
     响应式细节
     ============================================================ */
  @media (max-width: 640px) {
    .shell { padding: 14px 12px 60px; gap: 16px; }
    .topbar { padding: 12px 14px; box-shadow: 5px 5px 0 var(--shadow); }
    .controls { padding: 14px; gap: 16px; box-shadow: 5px 5px 0 var(--shadow); }
    .panel { box-shadow: 5px 5px 0 var(--shadow); }
    .brand-title { font-size: 1rem; letter-spacing: .06em; }
    .logo { width: 42px; height: 42px; }
    .logo .icon { width: 22px; height: 22px; }
    .editor, .output { min-height: 190px; }
    .seg { padding: 9px 12px; font-size: .72rem; }
    .btn { padding: 9px 13px; font-size: .74rem; }
    .history-item { padding: 11px 13px; }
    .toast { bottom: 16px; padding: 11px 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>

<script>
  /* 首帧前决定主题，避免闪烁 */
  (function () {
    try {
      var saved = localStorage.getItem("jlc-b64-theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  })();
</script>
</head>

<body>

<!-- ============================================================
     图标库（内置 SVG symbol，无外部依赖）
     ============================================================ -->

  </symbol>
  <symbol id="i-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4"/>

    <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
  </symbol>
  <symbol id="i-moon" viewBox="0 0 24 24">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </symbol>
  <symbol id="i-copy" viewBox="0 0 24 24">
    <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24">
    <path d="M20 6 9 17l-5-5"/>
  </symbol>
  <symbol id="i-swap" viewBox="0 0 24 24">
    <path d="m16 3 4 4-4 4"/><path d="M20 7H4"/>

<!-- ============================================================
     JLC 源码 —— 整个界面与交互逻辑全部由本语言书写
     ============================================================ -->
<script type="text/jlc" id="jlc-source">
app Base64Studio {
  state theme = "light";
  state mode = "encode";
  state variant = "standard";
  state input = "";
  state history = [];
  state toast = "";
  state toastKind = "info";
  state seq = 0;
  state kernelVersion = "0.1.0";

  derive output = mode == "encode"
    ? b64encode(input, variant == "url")
    : b64decode(input, variant == "url");

  derive outputText = output.ok ? output.value : "";
  derive outputError = output.ok ? "" : output.error;
  derive inputChars = len(input);
  derive outputChars = len(outputText);
  derive modeLabel = mode == "encode" ? "编码" : "解码";
  derive variantLabel = variant == "url" ? "URL 安全" : "标准";
  derive historyCount = len(history);
  derive toastIcon = toastKind == "error" ? "#i-alert" : "#i-check";

  action notify(message, kind = "info") {
    toast = message;
    toastKind = kind;
    after (2200) {
      if (toast == message) {
        toast = "";
      }
    }
  }

  action setMode(next) {
    mode = next;
  }

  action setVariant(next) {
    variant = next;
  }

  action toggleTheme() {
    theme = theme == "dark" ? "light" : "dark";
    applyTheme(theme);
  }

  action loadSample() {
    input = "JLC 内核 · Base64 工作台 —— 纯前端，零依赖，无 eval。";
    notify("已载入示例文本", "info");
  }

  action clearInput() {
    if (inputChars == 0) {
      notify("输入已经是空的", "info");
    } else {
      input = "";
      notify("已清空输入", "info");
    }
  }

  action swap() {
    if (output.ok && outputChars > 0) {
      input = outputText;
      mode = mode == "encode" ? "decode" : "encode";
      notify("已交换输入与输出", "ok");
    } else {
      notify("输出为空，无法交换", "error");
    }
  }

  action copyOutput() {
    if (output.ok && outputChars > 0) {
      if (copyText(outputText)) {
        notify("已复制到剪贴板", "ok");
      } else {
        notify("复制失败，请手动选择", "error");
      }
    } else {
      notify("没有可复制的内容", "error");
    }
  }

  action saveEntry() {
    if (output.ok && outputChars > 0) {
      seq += 1;
      let preview = input;
      if (len(preview) > 52) {
        preview = slice(preview, 0, 52) + "…";
      }
      history = prepend(history, {
        id: seq,
        label: modeLabel,
        preview: preview,
        payload: outputText,
        size: outputChars
      });
      if (len(history) > 6) {
        history = slice(history, 0, 6);
      }
      notify("已保存到历史", "ok");
    } else {
      notify("没有可保存的结果", "error");
    }
  }

  action useEntry(id) {
    for (entry in history) {
      if (entry.id == id) {
        input = entry.payload;
        notify("已载入历史记录", "ok");
      }
    }
  }

  action dropEntry(id) {
    let next = [];
    for (entry in history) {
      if (entry.id != id) {
        next = append(next, entry);
      }
    }
    history = next;
    notify("已删除该记录", "info");
  }

  action clearHistory() {
    history = [];
    notify("历史已清空", "info");
  }

  view {
    div(class = "shell") {

      header(class = "topbar") {
        div(class = "brand") {
          div(class = "logo") {
            svg(class = "icon icon--lg") { use(href = "#i-zap"); }
          }
          div(class = "brand-text") {
            h1(class = "brand-title") { text "Base64 Studio"; }
            p(class = "brand-sub") { text "JLC Kernel v" + kernelVersion; }
          }
        }
        div(class = "topbar-right") {
          span(class = "badge") { text modeLabel; }
          button(
            class = "btn btn--icon",
            title = "切换亮色 / 暗色主题",
            aria:label = "切换主题",
            on:click = { toggleTheme(); }
          ) {
            when (theme == "dark") {
              svg(class = "icon") { use(href = "#i-sun"); }
            } else {
              svg(class = "icon") { use(href = "#i-moon"); }
            }
          }
        }
      }

      section(class = "controls") {
        div(class = "control-group") {
          span(class = "control-label") { text "模式"; }
          div(class = "segmented") {
            button(
              class = "seg" + (mode == "encode" ? " seg--active" : ""),
              on:click = { setMode("encode"); }
            ) {
              svg(class = "icon") { use(href = "#i-arrow-right"); }
              span { text "编码"; }
            }
            button(
              class = "seg" + (mode == "decode" ? " seg--active" : ""),
              on:click = { setMode("decode"); }
            ) {
              svg(class = "icon") { use(href = "#i-arrow-left"); }
              span { text "解码"; }
            }
          }
        }
        div(class = "control-group") {
          span(class = "control-label") { text "字符集"; }
          div(class = "segmented") {
            button(
              class = "seg" + (variant == "standard" ? " seg--active" : ""),
              on:click = { setVariant("standard"); }
            ) { text "标准"; }
            button(
              class = "seg" + (variant == "url" ? " seg--active" : ""),
              on:click = { setVariant("url"); }
            ) { text "URL 安全"; }
          }
        }
        div(class = "control-group") {
          button(class = "btn", on:click = { loadSample(); }) {
            svg(class = "icon") { use(href = "#i-sparkles"); }
            span { text "示例"; }
          }
        }
      }

      section(class = "workspace") {

        article(class = "panel") {
          header(class = "panel-head") {
            div(class = "panel-title") {
              svg(class = "icon") { use(href = "#i-type"); }
              span { text "输入"; }
            }
            span(class = "counter") { text inputChars + " 字符"; }
          }
          textarea(
            class = "editor",
            bind:value = input,
            placeholder = mode == "encode" ? "在这里输入要编码的文本…" : "在这里粘贴要解码的 Base64…",
            attr:spellcheck = "false",
            attr:autocomplete = "off",
            attr:autocapitalize = "off",
            aria:label = "输入内容"
          );
          footer(class = "panel-foot") {
            button(class = "btn", on:click = { clearInput(); }) {
              svg(class = "icon") { use(href = "#i-eraser"); }
              span { text "清空"; }
            }
            button(class = "btn", on:click = { swap(); }) {
              svg(class = "icon") { use(href = "#i-swap"); }
              span { text "交换"; }
            }
          }
        }

        article(class = "panel") {
          header(class = "panel-head") {
            div(class = "panel-title") {
              svg(class = "icon") { use(href = "#i-hash"); }
              span { text "输出"; }
            }
            span(class = "counter") { text outputChars + " 字符 · " + variantLabel; }
          }
          div(class = "output") {
            when (output.ok) {
              when (outputChars > 0) {
                pre(class = "output-text") { text outputText; }
              } else {
                div(class = "output-empty") {
                  svg(class = "icon icon--lg") { use(href = "#i-sparkles"); }
                  span { text "结果会实时显示在这里"; }
                }
              }
            } else {
              div(class = "output-error") {
                svg(class = "icon") { use(href = "#i-alert"); }
                span { text outputError; }
              }
            }
          }
          footer(class = "panel-foot") {
            button(class = "btn btn--primary", on:click = { copyOutput(); }) {
              svg(class = "icon") { use(href = "#i-copy"); }
              span { text "复制"; }
            }
            button(class = "btn", on:click = { saveEntry(); }) {
              svg(class = "icon") { use(href = "#i-save"); }
              span { text "保存"; }
            }
          }
        }

      }

      section(class = "panel") {
        header(class = "panel-head") {
          div(class = "panel-title") {
            svg(class = "icon") { use(href = "#i-clock"); }
            span { text "历史记录"; }
          }
          div(class = "panel-actions") {
            span(class = "counter") { text historyCount + " / 6"; }
            when (historyCount > 0) {
              button(class = "btn btn--ghost btn--sm", on:click = { clearHistory(); }) {
                svg(class = "icon") { use(href = "#i-trash"); }
                span { text "清空"; }
              }
            }
          }
        }
        when (historyCount > 0) {
          ul(class = "history") {
            each (entry in history key entry.id) {
              li(class = "history-item") {
                div(class = "history-main") {
                  div(class = "history-top") {
                    span(class = "chip") { text entry.label; }
                    span(class = "history-size") { text entry.size + " 字符"; }
                  }
                  code(class = "history-preview") { text entry.preview; }
                }
                div(class = "history-actions") {
                  button(
                    class = "btn btn--icon btn--sm",
                    title = "载入到输入框",
                    aria:label = "载入记录",
                    on:click = { useEntry(entry.id); }
                  ) {
                    svg(class = "icon") { use(href = "#i-upload"); }
                  }
                  button(
                    class = "btn btn--icon btn--sm",
                    title = "删除该记录",
                    aria:label = "删除记录",
                    on:click = { dropEntry(entry.id); }
                  ) {
                    svg(class = "icon") { use(href = "#i-x"); }
                  }
                }
              }
            }
          }
        } else {
          div(class = "history-empty") {
            svg(class = "icon icon--lg") { use(href = "#i-inbox"); }
            span { text "暂无记录 · 点击「保存」留存当前结果"; }
          }
        }
      }

      footer(class = "footer") {
        span { text "源码 → JLC 字节码 → 栈式 VM · 零依赖 · 无 eval · CSP 友好" }
        span(class = "dot") { text "•" }
        span { text "JLC-VM " + kernelVersion }
      }

      when (toast != "") {
        div(class = "toast toast--" + toastKind, attr:role = "status") {
          svg(class = "icon") { use(href = toastIcon); }
          span { text toast; }
        }
      }

    }
  }
}
</script>

<!-- ============================================================
     宿主层：装载 JLC 内核，注入显式 capability
     ============================================================ -->
<script type="module">
import JLC, { OP_SPEC } from "./jlc.js";

/* ------------------------------------------------------------
   1. 主题初始化（读取 head 内联脚本已写入的值）
   ------------------------------------------------------------ */
const root = document.documentElement;
let initialTheme = root.dataset.theme === "dark" ? "dark" : "light";

/* ------------------------------------------------------------
   2. Base64 编解码（UTF-8 安全，URL-safe 可选）
   ------------------------------------------------------------ */
const textEncoder = new TextEncoder();
const textDecoder = new TextDecoder();

function bytesToBinary(bytes) {
  let binary = "";
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return binary;
}

function toBase64(text, urlSafe) {
  const bytes = textEncoder.encode(String(text ?? ""));
  let out = btoa(bytesToBinary(bytes));
  if (urlSafe) out = out.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return out;
}

function fromBase64(text, urlSafe) {
  let value = String(text ?? "").trim();
  if (value === "") return { ok: true, value: "" };

  if (urlSafe) value = value.replace(/-/g, "+").replace(/_/g, "/");
  value = value.replace(/\s+/g, "");

  if (!/^[A-Za-z0-9+/]*={0,2}$/.test(value)) {
    return { ok: false, error: "输入包含非 Base64 字符，请检查是否有空格或标点混入。" };
  }
  const remainder = value.length % 4;
  if (remainder === 1) {
    return { ok: false, error: "Base64 长度无效（长度除以 4 余 1），请检查是否缺少字符。" };
  }
  if (remainder !== 0) value += "=".repeat(4 - remainder);

  let binary;
  try {
    binary = atob(value);
  } catch (error) {
    return { ok: false, error: "无法解码：Base64 结构不合法。" };
  }

  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
  return { ok: true, value: textDecoder.decode(bytes) };
}

/* ------------------------------------------------------------
   3. 剪贴板
   ------------------------------------------------------------ */
function fallbackCopy(text) {
  try {
    const area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.top = "-1000px";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    area.setSelectionRange(0, area.value.length);
    const ok = document.execCommand("copy");
    area.remove();
    return ok;
  } catch (error) {
    return false;
  }
}

/* ------------------------------------------------------------
   4. 显式注入宿主能力（内核负责净化入参出参）
   ------------------------------------------------------------ */
const capabilities = {
  b64encode: (text, urlSafe) => ({ ok: true, value: toBase64(text, Boolean(urlSafe)) }),

  b64decode: (text, urlSafe) => fromBase64(text, Boolean(urlSafe)),

  copyText: (text) => {
    const value = String(text ?? "");
    try {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(value).catch(() => fallbackCopy(value));
        return true;
      }
    } catch (error) {
      /* 继续走兼容路径 */
    }
    return fallbackCopy(value);
  },

  applyTheme: (value) => {
    const next = String(value ?? "") === "dark" ? "dark" : "light";
    document.documentElement.dataset.theme = next;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", next === "dark" ? "#0e0e13" : "#ffd60a");
    try {
      localStorage.setItem("jlc-b64-theme", next);
    } catch (error) {
      /* 隐私模式下忽略 */
    }
    return next;
  },
};

/* ------------------------------------------------------------
   5. 挂载
   ------------------------------------------------------------ */
const boot = document.getElementById("boot");
const appRoot = document.getElementById("app");
const sourceNode = document.getElementById("jlc-source");
const startedAt = performance.now();

function dismissBoot() {
  const elapsed = performance.now() - startedAt;
  const wait = Math.max(0, 1100 - elapsed);
  window.setTimeout(() => {
    if (!boot) return;
    boot.classList.add("boot--done");
    window.setTimeout(() => boot.remove(), 700);
  }, wait);
}

try {
  const program = JLC.compile(sourceNode.textContent, { sourceName: "base64-studio.jlc" });

  /* JBC 字节码检查器：编译产物 → 序列化 → 指令统计 → 反汇编 */
  (() => {
    const panel = document.getElementById("jbc-panel");
    if (!panel) return;
    const module = program.module;
    const bytes = program.serialize();
    const histogram = new Map();
    for (const func of module.functions) {
      for (const byte of func.code) {
        const name = OP_SPEC?.[byte]?.name;
        if (name) histogram.set(name, (histogram.get(name) ?? 0) + 1);
      }
    }
    const top = [...histogram.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10)
      .map(([name, count]) => `${name}×${count}`).join(" · ");
    const sourceChars = sourceNode.textContent.length;
    const stats = document.getElementById("jbc-stats");
    if (stats) {
      stats.innerHTML = "";
      const items = [
        ["源码", `${sourceChars} 字符`],
        ["字节码", `${bytes.length} 字节 (${Math.round((1 - bytes.length / sourceChars) * 100)}%↓)`],
        ["魔数", [...bytes.slice(0, 4)].map((b) => b.toString(16).padStart(2, "0")).join(" ")],
        ["函数", String(module.functions.length)],
        ["常量池", String(module.pool.length)],
        ["全局引用", String(module.globalRefs.length)],
        ["高频指令", top || "—"],
      ];
      for (const [label, value] of items) {
        const item = document.createElement("span");
        const strong = document.createElement("b");
        strong.textContent = `${label} `;
        item.appendChild(strong);
        item.appendChild(document.createTextNode(value));
        stats.appendChild(item);
      }
    }
    const disassembly = document.getElementById("jbc-disassembly");
    if (disassembly) disassembly.textContent = program.disassemble();
    window.__jlcBytecode = { module, bytes };
  })();

  const handle = program.mount(appRoot, {
    state: {
      theme: initialTheme,
      kernelVersion: JLC.version ?? "0.1.0",
    },
    capabilities,
    onError: (error) => {
      console.error("[JLC]", error);
    },
  });

  /* 同步 meta 主题色 */
  capabilities.applyTheme(initialTheme);

  /* 页面隐藏时立即卸载，释放全部内核资源 */
  window.addEventListener("pagehide", () => handle.unmount(), { once: true });

  /* 暴露给调试台，方便观察 inspect() 的实时资源计数 */
  window.__jlcApp = handle;

  dismissBoot();
} catch (error) {
  console.error("[JLC] 启动失败", error);
  appRoot.textContent = "";
  const pre = document.createElement("pre");
  pre.className = "fatal";
  pre.textContent = "启动失败\n" + (error && error.message ? error.message : String(error));
  appRoot.appendChild(pre);
  dismissBoot();
}
</script>

</body>
