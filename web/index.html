<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JLC OS</title>
  <style>
    html, body { margin: 0; padding: 0; min-height: 100dvh; background: #fff; }
    #kernel-viewport { width: 100%; min-height: 100dvh; }
    .fatal-box { padding: 20px; color: #d32f2f; font-family: monospace; font-size: 14px; white-space: pre-wrap; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="kernel-viewport"></div>
  <script type="module">
    import { JLC } from "../jlc.js";

    async function bootJLC() {
      const viewport = document.getElementById("kernel-viewport");
      try {
        const hash = location.hash.replace(/^#\/?/, "");
        const jlcFile = hash ? `./apps/${hash}` : "./apps/todo.jlc";
        
        const res = await fetch(jlcFile, {
          headers: { Accept: "text/plain, */*" }
        });
        if (!res.ok) {
          viewport.innerHTML = `<div class="fatal-box">无法拉取应用文件: ${jlcFile} (HTTP ${res.status})</div>`;
          return;
        }
        const source = await res.text();

        JLC.mount(source, "#kernel-viewport", {
          policy: "open",
          isolation: "strict",
          autoDispose: true,
          onError: (err) => {
            console.error(err);
            viewport.innerHTML = `<div class="fatal-box">运行时异常:\n${err.stack || err.message || err}</div>`;
          }
        });
      } catch (err) {
        console.error(err);
        viewport.innerHTML = `<div class="fatal-box">内核装载失败:\n${err.stack || err.message || err}</div>`;
      }
    }

    let hashDebounceTimer;
    window.addEventListener("hashchange", () => {
      clearTimeout(hashDebounceTimer);
      hashDebounceTimer = setTimeout(() => location.reload(), 50);
    });
    bootJLC();
  </script>
</body>
</html>
